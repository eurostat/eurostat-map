<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body>
        <svg id="map"></svg>
        <script src="../../../build/eurostatmap.js"></script>
        <script>
            const map = eurostatmap
                .map('bivariateChoropleth')
                .title('Unemployment and population density')
                .subtitle('Inhabitants per km and % unemployed, 2021')
                .nutsLevel(2)
                .width(Math.min(1000, window.innerHeight))
                .nutsYear(2021)
                .stat('statV1', { eurostatDatasetCode: 'demo_r_d3dens', unitText: 'inh./km²', filters: { time: 2021 } })
                .encoding('x', { stat: 'statV1' })
                .stat('statV2', {
                    eurostatDatasetCode: 'lfst_r_lfu3rt',
                    filters: { age: 'Y20-64', sex: 'T', unit: 'PC', time: 2021 },
                    unitText: '%',
                })
                .encoding('y', { stat: 'statV2' })
                //.insets('default')
                //.scale('60M')

                .breaks1([100, 200])
                .breaks2([5, 10])
                .legend({
                    //rotation: -45,
                    boxOpacity: 1,
                    squareSize: 100,
                    label1: 'Inhabitants per km²',
                    label2: '% unemployed',
                    // breaks1: [100, 200],
                    // breaks2: [5, 10],
                    axisExtremes: {
                        x: { low: 'Low', high: 'High' },
                        y: { low: 'Low', high: 'High' },
                    },
                    annotations: {
                        topLeft: 'Low density <br>& High unemployment',
                        topRight: 'High density <br>& High unemployment',
                        bottomLeft: 'Low density <br>& Low unemployment',
                        bottomRight: 'High density <br>& Low unemployment',
                    },
                    xAxisTitleOffset: {x: 0, y: 8},
                    annotationLineLength: 10,
                    annotationPadding: {
                        topLeft: 19,
                        topRight: 10,
                        bottomLeft: 25,
                        bottomRight: 10,
                    },
                    position: 'top-right',
                })
                .zoomExtent([1, 100])
                .drawGraticule(false)
                .seaFillStyle('#d3dee8')
                .build()
        </script>
    </body>
</html>
