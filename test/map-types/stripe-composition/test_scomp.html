<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body>
        <svg id="map"></svg>
        <script src="../../../build/eurostatmap.js"></script>
        <script>
            const map = eurostatmap
                .map('stripeComposition')
                .scale('60M')
                .zoomExtent([1, 2])

                //livestock
                .nutsLevel(1)
                .nutsYear(2016)
                .stripeSettings({ width: 12 })
                //.stripeOrientation(45)
                .stat('composition', {
                    eurostatDatasetCode: 'apro_mt_ls_r',
                    filters: { unit: 'THS_HD', time: '2024' },
                    unitText: 'heads',
                    categoryParameter: 'animals',
                    categoryCodes: ['A2000', 'A3100', 'A4100', 'A4200'],
                    categoryLabels: ['Bovines', 'Pigs', 'Sheep', 'Goats'],
                    categoryColors: ['#0060FA', '#E04040', '#33A033', '#BF9500'],
                    transform: (value) => value * 1000, // convert from 1000 heads to heads
                })
                .encoding('composition', { stat: 'composition' })
                .insets('default')
                .title('European livestock composition (2018)')
                .legend({ x: 10, y: 150, title: 'Animals', boxOpacity: 0.8, boxFill: 'white' })
                .seaFillStyle('white')
                .coastalMarginColor('lightgray')
                .drawGraticule(false)

                .build()
        </script>
    </body>
</html>
