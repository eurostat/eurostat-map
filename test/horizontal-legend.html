<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Horizontal legend variants</title>
    </head>
    <body>
        <svg id="map"></svg>
        <script src="../build/eurostatmap.js"></script>
        <script>
            // ?v=<variant>: manual check of orientation:'horizontal' (bounds, point of divergence, ranges, hover)
            const variants = {
                thresholds: {},
                maxmin: { maxMin: true },
                maxminlabels: { maxMin: true, maxMinLabels: [' (min)', ' (max)'] },
                ranges: { labelType: 'ranges' },
                rangesmaxmin: { labelType: 'ranges', maxMin: true },
                divsingle: { pointOfDivergence: 4, pointOfDivergenceLabel: 'EU average' },
                divarrows: { pointOfDivergence: 4, pointOfDivergenceLabel: 'Above|Below' },
                divstacked: { pointOfDivergence: 4, pointOfDivergenceLabel: 'Above|Below', pointOfDivergenceLabelsStacked: true },
                divextremes: { pointOfDivergence: 4, pointOfDivergenceLabel: 'Above average|Below average', pointOfDivergenceLabelsAtExtremes: true },
                divranges: { labelType: 'ranges', pointOfDivergence: 4, pointOfDivergenceLabel: 'Above|Below' },
                divnoline: { pointOfDivergence: 4, pointOfDivergenceLabel: 'Above|Below', showDivergingLine: false },
                all: { maxMin: true, pointOfDivergence: 4, pointOfDivergenceLabel: 'Above|Below' },
                descending: { maxMin: true, ascending: false },
            }
            const v = new URLSearchParams(location.search).get('v') || 'thresholds'
            window.myMap = eurostatmap
                .map('choropleth')
                .title('Population density in Europe')
                .width(900)
                .height(900)
                .nutsLevel(2)
                .stat('population-density', { eurostatDatasetCode: 'demo_r_d3dens', unitText: 'people/km²' })
                .encoding('fill', { stat: 'population-density', scale: 'quantile', classes: 7 })
                .legend({ position: 'bottom left', title: 'Density, people/km²', orientation: 'horizontal', width: 640, shapeHeight: 16, ...variants[v] })
                .build()
        </script>
    </body>
</html>
