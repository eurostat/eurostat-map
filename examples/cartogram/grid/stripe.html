<!doctype html>
<html lang="en">
    <head>
        <title>Stripe Composition Grid Cartogram</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body>
        <svg id="map"></svg>
        <script src="../../../build/eurostatmap.js"></script>
        <script>
            const YEAR = 2024
            const map = eurostatmap
                .map('stripeComposition')
                .title(`European livestock composition, ${YEAR}`)
                .gridCartogram(true)
                .nutsLevel(0)
                .stripeSettings({ width: 12 })
                .stat('composition', {
                    eurostatDatasetCode: 'apro_mt_ls_r',
                    filters: { unit: 'THS_HD', time: `${YEAR}` },
                    unitText: '1000 heads',
                    categoryParameter: 'animals',
                    categoryCodes: ['A2000', 'A3100', 'A4100', 'A4200'],
                    categoryLabels: ['Bovines', 'Pigs', 'Sheep', 'Goats'],
                    categoryColors: ['#0060FA', '#E04040', '#33A033', '#BF9500'],
                })
                .encoding('composition', { stat: 'composition' })

                .legend({ x: 10, y: 150, title: 'Animals', boxOpacity: 0.8, boxFill: 'white' })
                .build()
        </script>
    </body>
</html>
