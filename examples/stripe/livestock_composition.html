<!doctype html>
<html lang="en">
    <head>
        <title>Livestock Stripe Composition</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body>
        <svg id="map"></svg>
        <script src="../../build/eurostatmap.js"></script>
        <script>
            const map = eurostatmap
                .map('stripeComposition')
                .width(800)
                .title('European livestock composition')
                .subtitle('2024')
                .scale('60M')
                .zoomExtent([1, 2])
                .nutsLevel(2)
                .nutsYear(2024)
                .stripeSettings({ width: 12 })
                .stat(
                    'composition',
                    { eurostatDatasetCode: 'tgs00045', filters: { unit: 'THS_HD', time: '2024' }, unitText: '1000 heads' },
                    'animals',
                    ['A2000', 'A3100', 'A4100', 'A4200'],
                    ['bovines', 'pigs', 'sheeps', 'goats'],
                    ['#7fc97f', '#ffff99', '#386cb0', '#f0027f']
                )
                .encoding('composition', { stat: 'composition' })
                .legend({ title: 'Animals', boxOpacity: 1, boxFill: 'white', titlePadding: 0 })

            map.build()
        </script>
    </body>
</html>
