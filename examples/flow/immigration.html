<!doctype html>
<html lang="en">
    <head>
        <title>Immigration flows within the EU</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                font:
                    1rem system-ui,
                    sans-serif;
                color: #203244;
            }

            .selection-summary {
                margin: 0 0 0.75rem;
                font-size: 0.875rem;
            }

            .source {
                font-size: 0.875rem;
            }

            #map {
                --route-color: #176b87;
            }

            #map marker path[fill='context-stroke'] {
                fill: var(--route-color);
            }
        </style>
    </head>

    <body>
        <p id="selection-summary" class="selection-summary" role="status"></p>
        <svg id="map"></svg>
        <p class="source">
            Origin refers to country of previous residence.
            <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_imm5prv/default/table?lang=en">Source: Eurostat (migr_imm5prv)</a>
        </p>
        <script src="../../build/eurostatmap.js"></script>
        <script>
            // Eurostat migr_imm5prv, 2024, all ages and sexes, age in completed years, number of people.
            // The eight largest published flows from other EU Member States for each destination.
            const originsByDestination = {
                DE: { RO: 64325, PL: 44455, IT: 23184, BG: 22785, ES: 19201, HU: 14696, AT: 12701, FR: 12458 },
                NL: { PL: 16153, DE: 12828, ES: 9731, RO: 8609, BE: 8386, IT: 7366, EL: 7257, BG: 6589 },
                ES: { RO: 35747, FR: 29053, IT: 28945, DE: 26123, NL: 13130, PT: 12459, BE: 9492, PL: 7344 },
            }
            const countryNames = new Intl.DisplayNames('en', { type: 'region' })
            const counts = new Intl.NumberFormat('en')
            const summary = document.querySelector('#selection-summary')
            const routeColor = getComputedStyle(document.querySelector('#map')).getPropertyValue('--route-color').trim()
            const requestedCountry = new URLSearchParams(location.search).get('destination')
            let displayedCountry = Object.hasOwn(originsByDestination, requestedCountry) ? requestedCountry : 'DE'
            const destinationNames = Object.keys(originsByDestination).map((id) => countryNames.of(id))
            const destinationList = new Intl.ListFormat('en', { style: 'long', type: 'disjunction' }).format(destinationNames)

            function largestFlow(target) {
                const [[origin, count]] = Object.entries(originsByDestination[target])
                return { origin, count }
            }

            function describe(target) {
                const { origin, count } = largestFlow(target)
                return `Largest flow to ${countryNames.of(target)}: ${counts.format(count)} people from ${countryNames.of(origin)}. Click ${destinationList} to change the destination.`
            }

            function legendFor(target) {
                const { count } = largestFlow(target)
                const values = [0.25, 0.5].map((share) => Math.round((count * share) / 1000) * 1000).concat(count)
                return {
                    position: 'top right',
                    flowWidthLegend: {
                        title: 'People moving',
                        titlePadding: 40,
                        values,
                        labels: values.map((value) => counts.format(value)),
                    },
                    regionColorLegend: { title: 'Country role', labels: ['Previous residence', 'Destination'] },
                }
            }

            summary.textContent = describe(displayedCountry)

            function graphFor(target) {
                const links = Object.entries(originsByDestination[target]).map(([source, value]) => ({ source, target, value }))
                const nodes = [target, ...links.map(({ source }) => source)].map((id) => ({
                    id,
                    name: countryNames.of(id === 'EL' ? 'GR' : id),
                }))
                return { nodes, links }
            }

            const map = eurostatmap
                .map('flow')
                .width(795)
                .height(675)
                .responsive(true)
                .nutsLevel(0)
                .insets(false)
                .scale('20M')
                .title(`EU immigration to ${countryNames.of(displayedCountry)}`)
                .subtitle('Eight largest flows by country of previous residence, 2024')
                .position({ x: 4380000, y: 2920000, z: 5600 })
                .drawCoastalMargin(false)
                .flowGraph(graphFor(displayedCountry))
                .flowSettings({
                    lineType: 'straight',
                    arrows: true,
                    opacity: 1,
                    color: routeColor,
                    regionColors: ['#c7e0e8', '#72a8bc'],
                    maxWidth: 9,
                    minWidth: 1,
                })
                .legend(legendFor(displayedCountry))
                .onRegionClick((event, region) => showDestination(region.properties.id))

            // Clicking a country that has data makes it the destination; other countries are ignored.
            function showDestination(target) {
                if (!Object.hasOwn(originsByDestination, target) || target === displayedCountry) return
                displayedCountry = target
                const url = new URL(location.href)
                url.searchParams.set('destination', target)
                history.replaceState(null, '', url)
                summary.textContent = describe(target)
                map.title(`EU immigration to ${countryNames.of(target)}`)
                map.flowGraph(graphFor(target))
                map.legend(legendFor(target))
            }

            map.statData().unitText('people')
            map.build()
        </script>
    </body>
</html>
