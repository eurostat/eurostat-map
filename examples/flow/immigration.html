<!doctype html>
<html lang="en">
    <head>
        <title>Immigration flows within the EU</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                font:
                    1rem system-ui,
                    sans-serif;
                color: #203244;
            }

            .controls {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin: 0.5rem 0 0.75rem;
            }

            select,
            button {
                font: inherit;
                padding: 0.3rem 0.5rem;
            }

            .selection-summary {
                margin: 0 0 0.75rem;
                font-size: 0.875rem;
            }

            .source {
                font-size: 0.875rem;
            }
        </style>
    </head>

    <body>
        <form id="destination-form" class="controls" method="get">
            <label for="destination">Destination country</label>
            <select id="destination" name="destination">
                <option value="DE">Germany</option>
                <option value="NL">Netherlands</option>
                <option value="ES">Spain</option>
            </select>
            <button type="submit">Show routes</button>
        </form>
        <p id="selection-summary" class="selection-summary" role="status"></p>
        <svg id="map"></svg>
        <p class="source">
            Origin refers to country of previous residence.
            <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_imm5prv/default/table?lang=en">Source: Eurostat (migr_imm5prv)</a>
        </p>
        <script src="../../build/eurostatmap.js"></script>
        <script>
            // Eurostat migr_imm5prv, 2024, all ages and sexes, age in completed years, number of people.
            // The eight largest published flows from other EU Member States for each destination.
            const originsByDestination = {
                DE: { RO: 64325, PL: 44455, IT: 23184, BG: 22785, ES: 19201, HU: 14696, AT: 12701, FR: 12458 },
                NL: { PL: 16153, DE: 12828, ES: 9731, RO: 8609, BE: 8386, IT: 7366, EL: 7257, BG: 6589 },
                ES: { RO: 35747, FR: 29053, IT: 28945, DE: 26123, NL: 13130, PT: 12459, BE: 9492, PL: 7344 },
            }
            const countryNames = new Intl.DisplayNames('en', { type: 'region' })
            const counts = new Intl.NumberFormat('en')
            const form = document.querySelector('#destination-form')
            const destination = document.querySelector('#destination')
            const summary = document.querySelector('#selection-summary')
            const requestedCountry = new URLSearchParams(location.search).get('destination')
            const displayedCountry = Object.hasOwn(originsByDestination, requestedCountry) ? requestedCountry : 'DE'

            destination.value = displayedCountry
            const [[origin, count]] = Object.entries(originsByDestination[displayedCountry])
            summary.textContent = `Largest flow to ${countryNames.of(displayedCountry)}: ${counts.format(count)} people from ${countryNames.of(origin)}.`

            // Submit at most once if the browser emits both input and change.
            let submitting = false
            function submitDestination() {
                if (!submitting && destination.value !== displayedCountry) form.requestSubmit()
            }

            form.addEventListener('submit', () => {
                submitting = true
            })
            destination.addEventListener('input', submitDestination)
            destination.addEventListener('change', submitDestination)
            window.addEventListener('pageshow', (event) => {
                if (event.persisted) {
                    submitting = false
                    destination.value = displayedCountry
                }
            })

            function graphFor(target) {
                const links = Object.entries(originsByDestination[target]).map(([source, value]) => ({ source, target, value }))
                const nodes = [target, ...links.map(({ source }) => source)].map((id) => ({
                    id,
                    name: countryNames.of(id === 'EL' ? 'GR' : id),
                }))
                return { nodes, links }
            }

            const map = eurostatmap
                .map('flow')
                .nutsLevel(0)
                .insets(false)
                .scale('20M')
                .title(`EU immigration to ${countryNames.of(displayedCountry)}`)
                .subtitle('Eight largest flows by country of previous residence, 2024')
                .position({ x: 4380000, y: 2920000, z: 5600 })
                .drawCoastalMargin(false)
                .flowGraph(graphFor(displayedCountry))
                .flowSettings({
                    lineType: 'straight',
                    arrows: true,
                    opacity: 1,
                    color: '#176b87',
                    regionColors: ['#c7e0e8', '#72a8bc'],
                    maxWidth: 9,
                    minWidth: 1,
                })
                .legend({
                    position: 'top right',
                    flowWidthLegend: { title: 'People moving', values: [5000, 10000, 15000] },
                    regionColorLegend: { title: 'Country role', labels: ['Previous residence', 'Destination'] },
                })

            map.statData().unitText('people')
            map.build()
        </script>
    </body>
</html>
