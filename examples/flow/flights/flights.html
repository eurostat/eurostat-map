<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Passenger Flights</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
            }

            .flight-layout {
                display: grid;
                grid-template-columns: minmax(0, 795px) 235px;
                grid-template-areas: 'map details';
                align-items: start;
                gap: 12px;
                padding-right: 8px;
            }

            #flight-map {
                grid-area: map;
            }

            #map {
                display: block;
                max-width: 100%;
                height: auto;
            }

            .flight-details {
                grid-area: details;
                margin-top: 8px;
                font: 14px Arial, sans-serif;
                color: #383838;
            }

            .flight-details h2 {
                margin: 0 0 6px;
                font-size: 14px;
            }

            #flight-tooltip {
                /* Keep the latest hover content visible in this panel between routes. */
                position: static;
                opacity: 1 !important;
                pointer-events: auto;
                width: 100%;
                max-width: none;
                height: 9rem;
                max-height: none;
                box-sizing: border-box;
                overflow: auto;
                border: 1px solid #d5d5d5;
                border-radius: 6px;
            }

            .flight-tooltip-hint {
                margin: 0;
                padding: 10px;
            }

            @media (max-width: 640px) {
                .flight-layout {
                    grid-template-columns: minmax(0, 1fr);
                    grid-template-areas: 'details' 'map';
                    padding-right: 0;
                }

                .flight-details {
                    justify-self: end;
                    width: min(235px, calc(100% - 16px));
                    margin-right: 8px;
                }
            }

            .em-cntbn {
                /* opacity:0.9; */
                stroke: white !important;
            }

            .em-node-circle {
                fill: white;
                opacity: 0.6;
                stroke: #252525;
            }
        </style>
    </head>

    <body>
        <div class="flight-layout">
            <div id="flight-map"><svg id="map"></svg></div>
            <aside class="flight-details" aria-labelledby="flight-details-title">
                <h2 id="flight-details-title">Flight details</h2>
                <div id="flight-tooltip">
                    <p class="flight-tooltip-hint">Hover over a route or airport to see passenger counts.</p>
                </div>
            </aside>
        </div>

        <script src="../../../build/eurostatmap.js"></script>
        <script src="https://unpkg.com/proj4@2.19.10/dist/proj4.js"></script>

        <!-- use a module so `await` works at top level -->
        <script type="module">
            import { toFlowGraph } from './parse.js'

            // load JSON (parse the response)
            const data = await fetch('eurostat-flight-data.json').then((r) => r.json())
            const graph = toFlowGraph(data)

            // Build the map (assumes eurostatmap is available globally from your bundle)
            const map = eurostatmap
                .map('flow')
                .width(document.getElementById('flight-map').clientWidth)
                .title('Passenger flights, 2024')
                .header(true)
                .footer(true)
                .position({ x: 3900000, y: 2900000, z: 6400 })

                .flowGraph(graph)

                // line type
                .flowSettings({ lineType: 'straight', bidirectional: false, edgeBundling: true })
                .flowSettings({
                    bundleSettings: {
                        alphaDecay: 0.1,
                        chargeStrength: 10,
                        distanceMax: null, // if null, will default to twice the max dimension of the map
                        linkStrength: 0.7,
                        linkIterations: 1,
                    },
                })
                .flowSettings({ maxWidth: 10, minWidth: 0.1, internal: false })

                // flow accessories
                .flowSettings({ arrows: false, outlines: false })

                //nodes
                .flowSettings({ nodes: true })
                .flowSettings({ nodeType: 'circle' }) // donut or circle

                // gradients
                .flowSettings({ colorGradient: false, widthGradient: false, opacityGradient: false })

                // sankey-only
                // .flowStack(false)

                // color
                //.flowRegionColors(['#bbd7ee', '#c7e3c6']) // no regions here
                .flowSettings({ topLocations: 0 }) // Top N locations by flow volume
                .flowSettings({ opacity: 0.1, color: '#000' })

                .flowSettings({ labelOffsets: { x: 9, y: 0 } }) // Offsets for flow labels

                .tooltip({ id: 'flight-tooltip' })
                .labels({
                    values: false,
                    backgrounds: true,
                    shadows: true,
                })
                .nutsLevel(0)
                .legend({
                    //svgId: 'legend',
                    width: 220,
                    x: 20,
                    y: 150,
                    //title: 'Main legend title',
                    boxOpacity: 0,
                    flowWidthLegend: {
                        title: 'Passengers (flights)',
                        segments: 4,
                        width: 150,
                        titlePadding: 30, // FIXME
                        maxMin: true,
                        orientation: 'horizontal',
                    },
                    nodeSizeLegend: { title: 'Passengers (airports)', values: [60000000, 1000000], labels: ['60M', '1M'] },
                    flowColorLegend: false,
                    regionColorLegend: { title: 'Region colors' },
                })
                .drawCoastalMargin(false)
                .insets(false)
                .zoomExtent([0.03, 1000])
                .onBuild((map) => {
                    const svg = map.svg()
                    svg.attr('viewBox', `0 0 ${svg.attr('width')} ${svg.attr('height')}`)
                })
                .build()
        </script>
    </body>
</html>
