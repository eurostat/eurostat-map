<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Passenger Flights</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
            }

            :root {
                --eu-blue: #0e47cb;
                --eu-blue-light: #e8eefb;
                --eu-text: #383838;
                --eu-muted: #666;
                --eu-border: #ccc;
                --eu-surface: #f5f5f5;
            }

            body {
                font: 14px/1.4 Arial, sans-serif;
                color: var(--eu-text);
            }

            /* ---- layout: controls panel beside the map, stacked on narrow screens ---- */
            .flight-layout {
                display: grid;
                grid-template-columns: 270px minmax(0, 795px);
                align-items: start;
                gap: 16px;
                padding: 8px;
            }

            #flight-map {
                min-width: 0;
            }

            #map {
                display: block;
                max-width: 100%;
                height: auto;
            }

            /* ---- controls panel ---- */
            .flight-controls {
                border: 1px solid var(--eu-border);
                border-top: 4px solid var(--eu-blue);
                background: #fff;
            }

            .flight-controls summary {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 14px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                list-style: none;
            }

            .flight-controls summary::-webkit-details-marker {
                display: none;
            }

            .flight-controls summary::after {
                content: '';
                width: 8px;
                height: 8px;
                border-right: 2px solid var(--eu-blue);
                border-bottom: 2px solid var(--eu-blue);
                transform: rotate(45deg);
                transition: transform 0.15s ease;
            }

            .flight-controls[open] summary::after {
                transform: rotate(-135deg);
            }

            .flight-controls form {
                padding: 0 14px 14px;
            }

            .flight-controls fieldset {
                margin: 0;
                padding: 12px 0;
                border: 0;
                border-top: 1px solid #e3e3e3;
                display: grid;
                gap: 12px;
            }

            .flight-controls legend {
                padding: 0;
                margin-bottom: 2px;
                font-size: 12px;
                font-weight: bold;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--eu-blue);
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 4px;
                font-weight: bold;
            }

            .field-head {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }

            .field output {
                font-weight: normal;
                color: var(--eu-muted);
                font-variant-numeric: tabular-nums;
            }

            select {
                width: 100%;
                box-sizing: border-box;
                padding: 7px 10px;
                font: inherit;
                font-weight: normal;
                color: var(--eu-text);
                background: #fff;
                border: 1px solid var(--eu-border);
                border-radius: 4px;
            }

            select:hover {
                border-color: var(--eu-blue);
            }

            input[type='range'] {
                width: 100%;
                margin: 4px 0;
                accent-color: var(--eu-blue);
            }

            :is(select, input, button, summary):focus-visible {
                outline: 2px solid var(--eu-blue);
                outline-offset: 2px;
            }

            /* segmented control: mutually exclusive options as adjoining buttons */
            .segmented {
                display: flex;
                border: 1px solid var(--eu-border);
                border-radius: 6px;
                overflow: hidden;
            }

            .segmented input {
                position: absolute;
                opacity: 0;
                width: 0;
                height: 0;
            }

            .segmented label {
                flex: 1;
                padding: 8px 6px;
                text-align: center;
                font-weight: normal;
                cursor: pointer;
                user-select: none;
                background: #fff;
                transition:
                    background-color 0.15s ease,
                    color 0.15s ease;
            }

            .segmented label:not(:last-of-type) {
                border-right: 1px solid var(--eu-border);
            }

            .segmented label:hover {
                background: var(--eu-blue-light);
            }

            .segmented input:checked + label {
                background: var(--eu-blue);
                color: #fff;
                font-weight: bold;
            }

            .segmented input:focus-visible + label {
                outline: 2px solid var(--eu-blue);
                outline-offset: -2px;
            }

            /* on/off switches */
            .switch {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                cursor: pointer;
            }

            .switch input {
                appearance: none;
                flex: none;
                position: relative;
                width: 38px;
                height: 22px;
                margin: 0;
                border-radius: 11px;
                background: #b5b5b5;
                cursor: pointer;
                transition: background-color 0.15s ease;
            }

            .switch input::after {
                content: '';
                position: absolute;
                top: 3px;
                left: 3px;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #fff;
                transition: transform 0.15s ease;
            }

            .switch input:checked {
                background: var(--eu-blue);
            }

            .switch input:checked::after {
                transform: translateX(16px);
            }

            .controls-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding-top: 12px;
                border-top: 1px solid #e3e3e3;
            }

            .hint {
                margin: -4px 0 0;
                font-size: 0.85em;
                color: var(--eu-muted);
            }

            #summary {
                margin: 0;
                color: var(--eu-muted);
            }

            #reset-controls {
                padding: 7px 14px;
                font: inherit;
                font-weight: bold;
                color: var(--eu-blue);
                background: #fff;
                border: 1px solid var(--eu-blue);
                border-radius: 4px;
                cursor: pointer;
            }

            #reset-controls:hover {
                background: var(--eu-blue);
                color: #fff;
            }

            #empty-legend {
                padding: 8px 10px;
                border-radius: 4px;
                background: var(--eu-surface);
                font-size: 13px;
            }

            #empty-legend[hidden] {
                display: none;
            }

            #empty-legend .ramp {
                height: 10px;
                margin: 4px 0 2px;
                border: 1px solid #d5d5d5;
                background: linear-gradient(to right, var(--ramp));
            }

            #empty-legend .ramp-labels {
                display: flex;
                justify-content: space-between;
                color: var(--eu-muted);
            }

            @media (max-width: 900px) {
                .flight-layout {
                    grid-template-columns: minmax(0, 1fr);
                }
            }

            .em-cntbn {
                /* opacity:0.9; */
                stroke: white !important;
            }

            .em-node-circle {
                fill: white;
                opacity: 0.6;
                stroke: #252525;
            }

            .voronoi-cell {
                fill: none;
                stroke: grey;
                stroke-width: 1px;
                vector-effect: non-scaling-stroke;
                pointer-events: none;
            }
        </style>
    </head>

    <body>
        <div class="flight-layout">
            <details class="flight-controls" open>
                <summary>Map controls</summary>
                <form id="controls" onsubmit="return false">
                    <fieldset>
                        <legend>Data</legend>
                        <label class="field">Airport <select id="airport"></select></label>
                        <div class="field" role="radiogroup" aria-labelledby="theme-label">
                            <span id="theme-label">Line width means</span>
                            <div class="segmented">
                                <input type="radio" name="theme" id="theme-pax" value="Passengers carried" checked />
                                <label for="theme-pax">Passengers</label>
                                <input type="radio" name="theme" id="theme-empty" value="Empty seats" />
                                <label for="theme-empty">Empty seats</label>
                            </div>
                        </div>
                        <label class="field">
                            <span class="field-head">Show top flights <output id="topN-out" for="topN"></output></span>
                            <input id="topN" type="range" min="0" max="1600" step="10" value="800" />
                        </label>
                    </fieldset>
                    <fieldset>
                        <legend>Lines</legend>
                        <label class="field">
                            <span class="field-head">Max line width <output id="maxWidth-out" for="maxWidth"></output></span>
                            <input id="maxWidth" type="range" min="0.5" max="20" step="0.5" value="10" />
                        </label>
                        <label class="field">
                            <span class="field-head">Line opacity <output id="opacity-out" for="opacity"></output></span>
                            <input id="opacity" type="range" min="0.1" max="1" step="0.1" value="0.2" />
                        </label>
                        <div class="field" role="radiogroup" aria-labelledby="colour-label">
                            <span id="colour-label">Line colour means</span>
                            <div class="segmented">
                                <input type="radio" name="colourBy" id="colour-none" value="none" checked />
                                <label for="colour-none">Nothing</label>
                                <input type="radio" name="colourBy" id="colour-empty" value="empty" />
                                <label for="colour-empty">Empty seats</label>
                                <input type="radio" name="colourBy" id="colour-scope" value="scope" />
                                <label for="colour-scope">Domestic / international</label>
                            </div>
                        </div>
                        <div id="empty-legend" hidden>
                            Share of seats that are empty (%)
                            <div class="ramp"></div>
                            <div class="ramp-labels"><span id="empty-min"></span><span id="empty-max"></span></div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Display</legend>
                        <label class="switch"><span>Edge bundling</span><input id="bundling" type="checkbox" role="switch" checked /></label>
                        <label class="field">
                            <span class="field-head">Bundling strength <output id="strength-out" for="strength"></output></span>
                            <input id="strength" type="range" min="-40" max="30" step="5" value="10" />
                        </label>
                        <p class="hint">Positive values pull routes together, negative values push them apart.</p>
                        <label class="switch"><span>Merge directions (to and from)</span><input id="merge" type="checkbox" role="switch" checked /></label>
                        <label class="switch"><span>Voronoi cells</span><input id="voronoi" type="checkbox" role="switch" /></label>
                        <label class="switch"><span>Animate</span><input id="animate" type="checkbox" role="switch" /></label>
                    </fieldset>
                    <div class="controls-footer">
                        <p id="summary" aria-live="polite"></p>
                        <button type="button" id="reset-controls">Reset</button>
                    </div>
                </form>
            </details>
            <div id="flight-map"><svg id="map"></svg></div>
        </div>

        <script src="../../../build/eurostatmap.js"></script>
        <script src="https://unpkg.com/proj4@2.19.10/dist/proj4.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>

        <!-- use a module so `await` works at top level -->
        <script type="module">
            import { toFlowGraph } from './parse.js'

            // load JSON (parse the response). Each flight has `count` (passengers carried) and
            // `availableCount` (seats offered); see fetch-seats.mjs.
            const data = await fetch('eurostat-flight-data.json').then((r) => r.json())
            const airportByCode = new Map(data.airports.map((a) => [a.code, a]))
            const $ = (id) => document.getElementById(id)
            const fmt = (n) => Math.round(n).toLocaleString('en').replace(/,/g, ' ')
            const nameOf = (code) => airportByCode.get(code)?.name || code

            // ---- controls (same settings as the Observable notebook "EU flights map") ----
            const airportSelect = $('airport')
            airportSelect.add(new Option('All airports', ''))
            data.airports.forEach((a) => airportSelect.add(new Option(`${a.iata || a.code} — ${a.name}`, a.code)))

            function readSettings() {
                return {
                    airport: $('airport').value,
                    theme: document.querySelector('input[name=theme]:checked').value, // 'Passengers carried' | 'Empty seats'
                    topN: +$('topN').value, // 0 = all flights
                    maxWidth: +$('maxWidth').value,
                    opacity: +$('opacity').value,
                    colourBy: document.querySelector('input[name=colourBy]:checked').value, // 'none' | 'empty' (share of empty seats) | 'scope' (domestic vs international)
                    bundling: $('bundling').checked && $('merge').checked, // bundling has no side-by-side layout, so it is off for separate directions
                    strength: +$('strength').value, // > 0 bundles routes, < 0 pushes them apart
                    merge: $('merge').checked, // merge both directions of a route
                    voronoi: $('voronoi').checked,
                    animate: $('animate').checked,
                }
            }

            /** The flights to draw: filter by airport, optionally merge both directions, sort, keep the top N. */
            function selectFlights(s) {
                let flights = data.flights.filter((d) => d.count && d.availableCount && (!s.airport || d.origin === s.airport || d.destination === s.airport))

                const withValues = (d) => {
                    const empty = d.availableCount - d.count
                    return {
                        ...d,
                        empty,
                        emptyPct: (empty / d.availableCount) * 100,
                        international: airportByCode.get(d.origin)?.country !== airportByCode.get(d.destination)?.country,
                        value: s.theme === 'Passengers carried' ? d.count : empty,
                    }
                }

                // Group both directions of each route. The top-N cut is made on routes (ranked by their
                // combined value), so the number of routes shown is the same whether or not directions are merged.
                const routes = new Map()
                for (const d of flights) {
                    const [a, b] = d.origin < d.destination ? [d.origin, d.destination] : [d.destination, d.origin]
                    const key = a + '|' + b
                    const r = routes.get(key) || { origin: a, destination: b, count: 0, availableCount: 0, directions: [] }
                    r.count += d.count
                    r.availableCount += d.availableCount
                    r.directions.push(d)
                    routes.set(key, r)
                }

                let ranked = [...routes.values()]
                    .map((r) => ({ ...withValues(r), directions: r.directions.map(withValues).filter((d) => d.value > 0) }))
                    .filter((r) => r.value > 0)
                    .sort((a, b) => b.value - a.value)
                if (s.topN > 0) ranked = ranked.slice(0, s.topN)

                // merged: one line per route; otherwise one per direction (drawn side by side by the library)
                return s.merge ? ranked.map(({ directions, ...route }) => route) : ranked.flatMap((r) => r.directions)
            }

            // ---- tooltip ----
            function flowTooltip(flightsByKey, merged) {
                return (link) => {
                    const originId = link.originId ?? link.source.id
                    const destId = link.destId ?? link.target.id
                    const f = flightsByKey.get(originId + '|' + destId)
                    const rows = f
                        ? `<tr><td>${fmt(f.count)} passengers</td></tr>
                           <tr><td>${fmt(f.availableCount)} seats</td></tr>
                           <tr><td>${fmt(f.empty)} empty seats (${f.emptyPct.toFixed()}%)</td></tr>`
                        : `<tr><td>${fmt(link.value)} passengers</td></tr>`
                    const title = merged ? `${nameOf(originId)} – ${nameOf(destId)}` : `${nameOf(originId)} to ${nameOf(destId)}`
                    return `<div class="em-tooltip-bar"><b>${title}</b></div>
                        <div class="em-tooltip-text"><table class="em-tooltip-table"><tbody>${rows}</tbody></table></div>`
                }
            }

            // ---- overlays drawn on top of the built map ----
            function drawVoronoi(svg) {
                const container = svg.select('#em-flow-container')
                const points = []
                container.selectAll('.em-node-circle-group').each(function () {
                    const m = /translate\(([-\d.e]+),\s*([-\d.e]+)\)/.exec(this.getAttribute('transform') || '')
                    if (m) points.push([+m[1], +m[2]])
                })
                if (points.length < 2) return
                const voronoi = d3.Delaunay.from(points).voronoi([-5000, -5000, 5000, 5000])
                const g = container.insert('g', ':first-child').attr('class', 'em-voronoi')
                points.forEach((_, i) => g.append('path').attr('class', 'voronoi-cell').attr('d', voronoi.renderCell(i)))
            }

            // dots travelling along every route, more often on busier ones
            function startAnimation(svg, flightsByKey) {
                const container = svg.select('#em-flow-container')
                const layer = container.append('g').attr('class', 'em-particles').style('pointer-events', 'none')
                const routes = []
                container.selectAll('.em-flow-lines .em-flow-link').each(function () {
                    const f = flightsByKey.get(this.dataset.origin + '|' + this.dataset.dest)
                    if (f && this.getTotalLength) routes.push({ el: this, length: this.getTotalLength(), value: f.value })
                })
                if (!routes.length) return () => {}
                const rate = d3
                    .scaleSqrt()
                    .domain(d3.extent(routes, (r) => r.value))
                    .range([0.05, 2.5]) // dots per second
                const SPEED = 140 // px per second
                const particles = []
                let last = performance.now()
                let frame
                const tick = (now) => {
                    const dt = Math.min((now - last) / 1000, 0.1)
                    last = now
                    for (const r of routes) {
                        if (r.length && Math.random() < rate(r.value) * dt) {
                            particles.push({ route: r, dist: 0, dot: layer.append('circle').attr('r', 1.5).attr('fill', 'rgba(0,0,0,0.7)').node() })
                        }
                    }
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i]
                        p.dist += SPEED * dt
                        if (p.dist >= p.route.length) {
                            p.dot.remove()
                            particles.splice(i, 1)
                            continue
                        }
                        const pt = p.route.el.getPointAtLength(p.dist)
                        p.dot.setAttribute('cx', pt.x)
                        p.dot.setAttribute('cy', pt.y)
                    }
                    frame = requestAnimationFrame(tick)
                }
                frame = requestAnimationFrame(tick)
                return () => cancelAnimationFrame(frame)
            }

            // ---- build / rebuild the map from the current settings ----
            let stopAnimation = () => {}

            function render() {
                stopAnimation()
                stopAnimation = () => {}
                const s = readSettings()
                $('bundling').disabled = !$('merge').checked
                $('strength').disabled = !s.bundling
                $('strength-out').textContent = s.strength
                $('topN-out').textContent = s.topN || 'all'
                $('maxWidth-out').textContent = s.maxWidth
                $('opacity-out').textContent = s.opacity

                const flights = selectFlights(s)
                $('summary').textContent = `${fmt(flights.length)} flight${flights.length === 1 ? '' : 's'} shown`
                const flightsByKey = new Map(flights.map((f) => [f.origin + '|' + f.destination, f]))
                const graph = toFlowGraph({
                    airports: data.airports,
                    flights: flights.map((f) => ({ origin: f.origin, destination: f.destination, count: f.value })),
                })

                // colour lines by the share of empty seats (white-to-dark red, like d3.interpolateReds)
                const pcts = flights.map((f) => f.emptyPct)
                const [lo, hi] = [Math.min(...pcts), Math.max(...pcts)]
                const reds = (pct) => d3.interpolateReds(hi > lo ? Math.min(1, Math.max(0, (pct - lo) / (hi - lo))) : 1)
                const legend = $('empty-legend')
                legend.hidden = s.colourBy !== 'empty' || !flights.length
                if (!legend.hidden) {
                    legend.querySelector('.ramp').style.setProperty('--ramp', d3.range(0, 1.01, 0.1).map(d3.interpolateReds).join(','))
                    $('empty-min').textContent = lo.toFixed() + '%'
                    $('empty-max').textContent = hi.toFixed() + '%'
                }

                // line colour: black, the share of empty seats, or domestic vs international
                const flightOf = (d) => flightsByKey.get((d.originId ?? d.source.id) + '|' + (d.destId ?? d.target.id))
                const scopeColours = { international: '#2b2d42', domestic: '#d98324' }
                const lineColour =
                    s.colourBy === 'empty'
                        ? (d) => {
                              const f = flightOf(d)
                              return f ? reds(f.emptyPct) : '#000'
                          }
                        : s.colourBy === 'scope'
                          ? (d) => (flightOf(d)?.international ? scopeColours.international : scopeColours.domestic)
                          : '#000'

                // reset the svg (and its zoom state) before drawing the new map into it
                const svg = d3.select('#map')
                svg.selectAll('*').remove()
                svg.property('__zoom', d3.zoomIdentity)

                const label = s.airport ? `Flights from ${nameOf(s.airport)} (${s.airport})` : `Top ${s.topN || 'all'} flights by ${s.theme.toLowerCase()}`

                eurostatmap
                    .map('flow')
                    .width(document.getElementById('flight-map').clientWidth)
                    .title('Passenger flights, 2024')
                    .subtitle(label)
                    .header(true)
                    .footer(true)
                    .position({ x: 3900000, y: 2900000, z: 6400 })

                    .flowGraph(graph)

                    // line type
                    // merged: one line per route. Separate directions: both drawn side by side (not with edge bundling)
                    .flowSettings({ lineType: 'straight', bidirectional: !s.merge, bidirectionalLayout: 'parallel', edgeBundling: s.bundling })
                    .flowSettings({
                        bundleSettings: {
                            alphaDecay: 0.1,
                            chargeStrength: s.strength, // negative: routes are pushed apart instead of bundled
                            distanceMax: null, // use the default bundling distance
                            linkStrength: 0.7,
                            linkIterations: 1,
                        },
                    })
                    .flowSettings({ maxWidth: s.maxWidth, minWidth: 0.6, internal: false })

                    // flow accessories
                    .flowSettings({ arrows: !s.merge && !s.bundling, outlines: false })

                    //nodes
                    .flowSettings({ nodes: true })
                    .flowSettings({ nodeType: 'circle' }) // donut or circle

                    // gradients
                    .flowSettings({ colorGradient: false, widthGradient: false, opacityGradient: false })

                    // color: black, or the share of empty seats
                    .flowSettings({ topLocations: 0 }) // Top N locations by flow volume
                    .flowSettings({
                        opacity: s.opacity,
                        color: lineColour,
                    })

                    .flowSettings({ labelOffsets: { x: 9, y: 0 } }) // Offsets for flow labels

                    .tooltip({ textFunction: flowTooltip(flightsByKey, s.merge), offset: { x: 60, y: 40 } }) // follows the pointer; default offset is 30 x 20
                    .labels({
                        values: false,
                        backgrounds: true,
                        shadows: true,
                    })
                    .nutsLevel(0)
                    .legend({
                        width: 220,
                        x: 20,
                        y: 150,
                        boxOpacity: 0,
                        flowWidthLegend: {
                            title: s.theme === 'Passengers carried' ? 'Passengers (flights)' : 'Empty seats (flights)',
                            segments: 4,
                            width: 150,
                            titlePadding: 30, // FIXME
                            maxMin: true,
                            orientation: 'horizontal',
                        },
                        nodeSizeLegend: { title: 'Passengers (airports)', values: [60000000, 1000000], labels: ['60M', '1M'] },
                        flowColorLegend:
                            s.colourBy === 'scope'
                                ? {
                                      title: 'Flight type',
                                      marginTop: 30,
                                      items: [
                                          { label: 'International', color: scopeColours.international },
                                          { label: 'Domestic', color: scopeColours.domestic },
                                      ],
                                  }
                                : false,
                        regionColorLegend: { title: 'Region colors' },
                    })
                    .drawCoastalMargin(false)
                    .insets(false)
                    .zoomExtent([0.03, 1000])
                    .onBuild((map) => {
                        const svg = map.svg()
                        svg.attr('viewBox', `0 0 ${svg.attr('width')} ${svg.attr('height')}`)
                        if (s.voronoi) drawVoronoi(svg)
                        if (s.animate) {
                            svg.select('.em-flow-lines').style('opacity', 0) // dots only; hover still works
                            stopAnimation = startAnimation(svg, flightsByKey)
                        }
                    })
                    .build()
            }

            // on narrow screens start with the controls folded away so the map is visible straight away
            if (window.matchMedia('(max-width: 900px)').matches) document.querySelector('.flight-controls').open = false

            let timer
            $('controls').addEventListener('input', () => {
                clearTimeout(timer)
                timer = setTimeout(render, 150)
            })
            $('reset-controls').addEventListener('click', () => {
                $('controls').reset()
                render()
            })
            render()
        </script>
    </body>
</html>
