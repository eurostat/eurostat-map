<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Commuting corridors in France</title>
        <link rel="stylesheet" href="commuting-corridors.css" />
    </head>
    <body class="commuting-map">
        <form id="dataset-form" class="dataset-controls" method="get">
            <label for="area">Area</label>
            <select id="area" name="area" data-default="france" disabled></select>
            <label for="dataset">Dataset</label>
            <select id="dataset" name="dataset" disabled></select>
            <button type="submit" disabled>Show data</button>
        </form>
        <svg id="map"></svg>
        <p id="census-note" hidden>
            Only flows within the selected groups of communes are shown. Source:
            <a id="census-source">INSEE home-to-work flows</a>
            . Estimates are rounded to the nearest person. Counts below 200 are approximate. Successive census estimates can share survey years.
        </p>
        <script src="../../build/eurostatmap.js"></script>
        <script src="commuting-census-data.js"></script>
        <script src="commuting-corridors.js"></script>
        <script src="commuting-corridors-insee.js"></script>
    </body>
</html>
