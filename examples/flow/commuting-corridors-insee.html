<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Commuting in Bourgogne-Franche-Comté</title>
        <link rel="stylesheet" href="commuting-corridors.css" />
    </head>
    <body class="commuting-map">
        <form id="dataset-form" class="dataset-controls" method="get">
            <label for="area">Area</label>
            <select id="area" name="area" disabled>
                <option value="dijon">Dijon, Dole and Besançon</option>
                <option value="belfort">Belfort, Héricourt and Montbéliard</option>
            </select>
            <label for="dataset">Dataset</label>
            <select id="dataset" name="dataset" disabled>
                <option value="2022">INSEE census 2022</option>
                <option value="2021">INSEE census 2021</option>
                <option value="2020">INSEE census 2020</option>
                <option value="2019">INSEE census 2019</option>
            </select>
            <button type="submit" disabled>Show data</button>
        </form>
        <svg id="map"></svg>
        <p id="census-note" hidden>
            Source:
            <a id="census-source">INSEE home-to-work flows</a>
            . Estimates are rounded to the nearest person. Counts below 200 are approximate. Successive census estimates can share survey years.
        </p>
        <script src="../../build/eurostatmap.js"></script>
        <script src="commuting-corridors.js"></script>
    </body>
</html>
