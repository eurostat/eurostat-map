<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Textured Choropleth</title>
        <style>
            .em-map .em-title {
                fill: #444;
            }
            .em-map .em-bn-0,
            .em-map .em-bn-1,
            .em-map .em-bn-2,
            .em-map .em-bn-3,
            .em-map .em-bn-co {
                stroke: #777;
            }
            .em-map .em-bn-0,
            .em-map .em-bn-co {
                stroke-width: 1px;
            }
            .em-map .em-bn-1,
            .em-map .em-bn-2,
            .em-map .em-bn-3 {
                stroke-width: 0.2px;
            }
            .em-map .em-bn-oth {
                stroke: #444;
                stroke-width: 1px;
            }
            .em-map .em-cntrg {
                fill: white;
            }
            .em-map .em-sea {
                fill: #e9e9e9;
            }
            .em-map .em-graticule {
                stroke: #888;
            }
        </style>
    </head>

    <body>
        <svg id="map"></svg>
        <script src="../../build/eurostatmap.js"></script>
        <script>
            eurostatmap
                .map('choropleth')
                .title('Population density in Europe')
                .stat('value', { eurostatDatasetCode: 'demo_r_d3dens', unitText: ' people/km²', filters: { TIME: '2021' } })
                .encoding('fill', { stat: 'value' })
                .nutsLevel(1)
                .scale('60M')
                .classificationMethod('threshold')
                .thresholds([35, 50, 80, 100, 140, 180, 300, 500, 1300])
                // define dot density pattern
                .filtersDefinitionFunction(
                    eurostatmap.getFillPatternDefinitionFunction({
                        patternSize: 5,
                        shape: 'circle',
                        bckColor: 'white',
                        symbColor: 'black',
                    })
                )
                .hoverColor('darkblue')
                .coastalMarginSettings({ standardDeviation: 10, strokeWidth: 5, color: '#777' })
                .tooltip({ showFlags: false })
                .legend({
                    title: 'Density - inhab./km²',
                    decimals: 0,
                    x: 560,
                    y: 50,
                    noData: false,
                })
                .build()
        </script>
    </body>
</html>
