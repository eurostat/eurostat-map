<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            .em-title {
                font-size: 20.5px !important;
            }
        </style>
    </head>

    <body>
        <svg id="map61"></svg>

        <script src="../../build/eurostatmap.js"></script>
        <script>
            async function buildMap() {
                const config = await fetch('./data/gdp-change.json').then((response) => {
                    if (!response.ok) throw new Error(`Could not load GDP map data (${response.status})`)
                    return response.json()
                })
                const [lowerThreshold, upperThreshold] = config.thresholds
                const clientWidth = document.documentElement.clientWidth
                const mapSize = { width: Math.min(Math.floor(clientWidth), 700), height: 680 }

                eurostatmap
                    .map('bivariateChoropleth')
                    .svgId('map61')
                    .width(mapSize.width)
                    .height(mapSize.height)
                    .header(true)
                    .footer(true)
                    .scale(config.scale)
                    .nutsLevel(config.nutsLevel)
                    .nutsYear(config.nutsYear)
                    .title(config.title)
                    .subtitle(config.subtitle)
                    .hoverColor('#ffff33')
                    .showSourceLink(false)
                    .footnote([config.footnote, config.source].filter(Boolean).join('<br>'))
                    .footnoteWrap(55)
                    .stat('gdpChange', { customData: config.stats.gdpChange, unitText: 'percentage points' })
                    .encoding('y', { stat: 'gdpChange' })
                    .stat('urbanRuralType', { customData: config.stats.urbanRuralType })
                    .encoding('x', { stat: 'urbanRuralType' })
                    .numberOfClasses(3)
                    .classifier1((v) => v - 1)
                    .classifier2((value) => (value >= upperThreshold ? 2 : value >= lowerThreshold ? 1 : 0))
                    .classToFillStyle((i, j) => {
                        const classId = config.classMatrix[i]?.[j]
                        return config.colorsByClass[classId] || config.colorsByClass[':']
                    })
                    .tooltip({
                        textFunction: function (rg, map) {
                            if (rg.properties.id === 'UK') return ' '
                            const buf = []
                            // Header with region name and ID
                            const regionName = rg.properties.na || rg.properties.name
                            const regionId = rg.properties.id
                            buf.push(`
                                <div class="em-tooltip-bar">
                                    <b>${regionName}</b>${regionId ? ` (${regionId})` : ''}
                                </div>
                            `)

                            //start table
                            buf.push(`
                            <div class="em-tooltip-text no-data">
                                <table class="em-tooltip-table">
                                    <tbody>
                                        <tr><td>`)

                            //URT value
                            const sv2 = map.statData('urbanRuralType').get(rg.properties.id)
                            if (!sv2 || (sv2.value != 0 && !sv2.value) || sv2.value == ':') buf.push(map.noDataText_)
                            else {
                                buf.push(config.urbanRuralLabels[sv2.value])
                            }

                            buf.push('<br>')

                            //stat value
                            const sv1 = map.statData('gdpChange').get(rg.properties.id)
                            if (!sv1 || (sv1.value != 0 && !sv1.value) || sv1.value == ':') buf.push(map.noDataText_)
                            else {
                                buf.push(sv1.value)
                                //unit 1
                                const unit1 = map.statData('gdpChange').unitText()
                                if (unit1) buf.push(' ' + unit1)
                            }

                            //close table
                            buf.push(`</td></tr>
                                    </tbody>
                                </table>
                            </div>`)

                            return buf.join('')
                        },
                    })
                    .legend({
                        label1: config.urbanRuralLegendLabel,
                        label2: config.gdpLegendLabel,
                        axisArrows: { x: false, y: true },
                        showAxisExtremes: { x: false, y: true },
                        breaks2: config.thresholds.map((value) => `${value > 0 ? '+' : ''}${value}%`),
                        axisExtremes: {
                            x: { low: 'Low', high: 'High' },
                            y: { low: 'Decrease', high: 'Increase' },
                        },
                        x: 60,
                        y: 120,
                        squareSize: 100,
                        noDataPadding: 0,
                        noDataShapeHeight: 16,
                        noDataShapeWidth: 16,
                    })
                    //.zoomExtent([0.1, 3])
                    .zoomButtons(true)
                    .insets('image')
                    .onBuild(function (m) {
                        // The library's default view fits the full geometry bbox with ~27% padding
                        // around it (DEFAULT_FIT_ZOOM in src/core/geo/projection.js). That's too much
                        // breathing room for this map, so zoom in a bit further on top of that default.
                        const ZOOM_IN_FACTOR = 0.9 // < 1 zooms in, > 1 zooms out, relative to the auto-fit view
                        const defaultPosition = m.position()
                        m.position({ ...defaultPosition, z: defaultPosition.z * ZOOM_IN_FACTOR })

                        // Boundaries copyright goes on the right, below the map — footnote/source stay on the left.
                        const footer = document.getElementById('em-footer-map61')
                        if (!footer) return
                        footer.querySelector('#em-footnote-boundaries')?.remove()
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text')
                        text.setAttribute('id', 'em-footnote-boundaries')
                        text.setAttribute('class', 'em-footnote')
                        text.setAttribute('x', mapSize.width - 5)
                        text.setAttribute('y', 10)
                        text.setAttribute('text-anchor', 'end')
                        text.innerHTML = 'Cartography: GISCO. Boundaries: ©EuroGeographics ©OSM'
                        footer.appendChild(text)
                    })
                    .build()
            }

            buildMap().catch((error) => console.error(error))
        </script>
    </body>
</html>
