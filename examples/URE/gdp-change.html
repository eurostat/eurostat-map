<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
            }

            .gdp-map-layout {
                display: grid;
                grid-template-columns: minmax(320px, 35%) minmax(0, 65%);
                width: 100%;
                align-items: start;
            }

            .gdp-small-multiples {
                display: grid;
                grid-template-rows: repeat(3, minmax(0, 1fr)) auto;
                gap: 0.4rem;
                padding: 0.75rem 0 0.75rem 0.75rem;
                box-sizing: border-box;
                height: 100vh;
                height: 100dvh;
                max-height: 100vh;
                max-height: 100dvh;
                overflow: hidden;
            }

            .gdp-small-map-card {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
                width: 100%;
                overflow: hidden;
            }

            .gdp-small-map-card h2 {
                margin: 0 0 0.1rem;
                color: #333;
                font-size: 0.9rem;
                font-weight: 600;
                text-align: center;
            }

            .gdp-small-map-card .em-map-wrapper,
            .gdp-small-map-card svg,
            .gdp-main-map svg {
                display: block;
                max-width: 100%;
                height: auto;
            }

            .gdp-small-map-card .em-map-wrapper {
                flex: 1 1 auto;
                min-height: 0;
            }

            .gdp-shared-scale {
                padding: 0.15rem 0.5rem 0.25rem;
                font-size: 0.72rem;
                color: #444;
            }

            .gdp-shared-scale-title {
                margin-bottom: 0.25rem;
                text-align: center;
                font-weight: 600;
            }

            .gdp-shared-scale-colors {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                height: 0.55rem;
            }

            .gdp-shared-scale-row {
                display: grid;
                grid-template-columns: 4.8rem 1fr;
                align-items: center;
                gap: 0.35rem;
                margin-top: 0.2rem;
            }

            .gdp-shared-scale-row-label {
                text-align: right;
            }

            .gdp-shared-scale-labels {
                display: flex;
                justify-content: space-between;
                margin-top: 0.2rem;
                margin-left: 5.15rem;
            }

            .gdp-main-map {
                min-width: 0;
            }

            @media (max-width: 900px) {
                .gdp-map-layout {
                    grid-template-columns: 1fr;
                }

                .gdp-small-multiples {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                    grid-template-rows: auto auto;
                    height: auto;
                    padding: 0.5rem;
                }

                .gdp-shared-scale {
                    grid-column: 1 / -1;
                }
            }

            @media (max-width: 600px) {
                .gdp-small-multiples {
                    grid-template-columns: 1fr;
                    grid-template-rows: repeat(3, minmax(0, 1fr)) auto;
                    height: 100vh;
                    height: 100dvh;
                }
            }
        </style>
    </head>

    <body>
        <div class="gdp-map-layout">
            <aside class="gdp-small-multiples" aria-label="GDP change by urban-rural typology">
                <section class="gdp-small-map-card">
                    <h2>Urban regions</h2>
                    <svg id="gdp-urban"></svg>
                </section>
                <section class="gdp-small-map-card">
                    <h2>Intermediate regions</h2>
                    <svg id="gdp-intermediate"></svg>
                </section>
                <section class="gdp-small-map-card">
                    <h2>Rural regions</h2>
                    <svg id="gdp-rural"></svg>
                </section>
                <div id="gdp-shared-scale" class="gdp-shared-scale" aria-label="Shared GDP change colour scale"></div>
            </aside>
            <main class="gdp-main-map">
                <svg id="map61"></svg>
            </main>
        </div>

        <script src="../../build/eurostatmap.js"></script>
        <script>
            async function buildMap() {
                const config = await fetch('./data/gdp-change.json').then((response) => {
                    if (!response.ok) throw new Error(`Could not load GDP map data (${response.status})`)
                    return response.json()
                })
                const [lowerThreshold, upperThreshold] = config.thresholds
                const divergingColors = {
                    1: ['#8c2d04', '#d94801', '#fdbb84', '#fff7f7', '#f29ca3', '#c94b5b', '#8f1738'],
                    2: ['#8c510a', '#bf812d', '#dfc27d', '#fff8f0', '#c2a27d', '#8c6845', '#543b25'],
                    3: ['#4d7c0f', '#84ad32', '#c2d77a', '#f5fbf5', '#91c6a4', '#43956a', '#146b4a'],
                }
                const numericGdpValues = Object.values(config.stats.gdpChange).map(Number).filter(Number.isFinite)
                const maxAbsoluteChange = Math.max(...numericGdpValues.map(Math.abs))
                const third = maxAbsoluteChange / 3
                const divergingThresholds = [-2 * third, -third, -Number.EPSILON, Number.EPSILON, third, 2 * third]

                buildSmallMultiples(config, divergingColors, divergingThresholds, getSmallMapSize())
                renderSharedScale(divergingColors, maxAbsoluteChange)

                eurostatmap
                    .map('bivariateChoropleth')
                    .svgId('map61')
                    .width(900)
                    .height(680)
                    .header(true)
                    .footer(true)
                    .scale(config.scale)
                    .nutsLevel(config.nutsLevel)
                    .nutsYear(config.nutsYear)
                    .title(config.title)
                    .subtitle(config.subtitle)
                    .footnote([config.footnote, config.source].filter(Boolean).join(' '))
                    .stat('gdpChange', { customData: config.stats.gdpChange, unitText: 'percentage points' })
                    .encoding('y', { stat: 'gdpChange' })
                    .stat('urbanRuralType', { customData: config.stats.urbanRuralType })
                    .encoding('x', { stat: 'urbanRuralType' })
                    .numberOfClasses(3)
                    .classifier1((v) => v - 1)
                    .classifier2((value) => (value >= upperThreshold ? 2 : value >= lowerThreshold ? 1 : 0))
                    .classToFillStyle((i, j) => {
                        const classId = config.classMatrix[i]?.[j]
                        return config.colorsByClass[classId] || config.colorsByClass[':']
                    })
                    .tooltip({
                        textFunction: function (rg, map) {
                            if (rg.properties.id === 'UK') return ' '
                            const buf = []
                            // Header with region name and ID
                            const regionName = rg.properties.na || rg.properties.name
                            const regionId = rg.properties.id
                            buf.push(`
                        <div class="em-tooltip-bar">
                            <b>${regionName}</b>${regionId ? ` (${regionId})` : ''}
                        </div>
                    `)

                            //start table
                            buf.push(`
                    <div class="em-tooltip-text no-data">
                        <table class="em-tooltip-table">
                            <tbody>
                                <tr><td>`)

                            //URT value
                            const sv2 = map.statData('urbanRuralType').get(rg.properties.id)
                            if (!sv2 || (sv2.value != 0 && !sv2.value) || sv2.value == ':') buf.push(map.noDataText_)
                            else {
                                buf.push(config.urbanRuralLabels[sv2.value])
                            }

                            buf.push('<br>')

                            //stat value
                            const sv1 = map.statData('gdpChange').get(rg.properties.id)
                            if (!sv1 || (sv1.value != 0 && !sv1.value) || sv1.value == ':') buf.push(map.noDataText_)
                            else {
                                buf.push(sv1.value)
                                //unit 1
                                const unit1 = map.statData('gdpChange').unitText()
                                if (unit1) buf.push(' ' + unit1)
                            }

                            //close table
                            buf.push(`</td></tr>
                            </tbody>
                        </table>
                    </div>`)

                            return buf.join('')
                        },
                    })
                    .legend({
                        label1: config.urbanRuralLegendLabel,
                        label2: config.gdpLegendLabel,
                        axisArrows: { x: false, y: true },
                        showAxisExtremes: { x: false, y: true },
                        // breaks1: config.thresholds.map(String),
                        x: 40,
                        y: 120,
                        squareSize: 85,
                        noDataPadding: 30,
                        noDataShapeHeight: 16,
                        noDataShapeWidth: 16,
                    })
                    .zoomExtent([0.1, 3])
                    .insets('default')
                    .build()
            }

            function getSmallMapSize() {
                const container = document.querySelector('.gdp-small-multiples')
                const width = Math.max(320, Math.floor(container.clientWidth - 12))
                const reservedHeight = 190
                const height = Math.max(105, Math.floor((document.documentElement.clientHeight - reservedHeight) / 3))
                return { width, height }
            }

            function buildSmallMultiples(config, colorsByTypology, thresholds, size) {
                const typologies = [
                    { value: 1, svgId: 'gdp-urban' },
                    { value: 2, svgId: 'gdp-intermediate' },
                    { value: 3, svgId: 'gdp-rural' },
                ]

                typologies.forEach(({ value, svgId }) => {
                    const typedData = Object.fromEntries(
                        Object.entries(config.stats.gdpChange).filter(([regionId]) => Number(config.stats.urbanRuralType[regionId]) === value)
                    )

                    eurostatmap
                        .map('choropleth')
                        .svgId(svgId)
                        .width(size.width)
                        .height(size.height)
                        .header(false)
                        .footer(false)
                        .bottomText(false)
                        .scale(config.scale)
                        .nutsLevel(config.nutsLevel)
                        .nutsYear(config.nutsYear)
                        .stat('gdpChange', { customData: typedData, unitText: 'percentage points' })
                        .encoding('fill', { stat: 'gdpChange' })
                        .classificationMethod('threshold')
                        .thresholds(thresholds)
                        .colors(colorsByTypology[value])
                        .noDataFillStyle('#f1f1f1')
                        .legend(false)
                        .zoomExtent([0.1, 8])
                        .zoomButtons(false)
                        .position({ x: 4800000, y: 3400000, z: 6000 })
                        .transitionDuration(0)
                        .tooltip({
                            textFunction: function (region, map) {
                                const regionId = region.properties.id
                                const regionName = region.properties.na || region.properties.name
                                const typology = config.stats.urbanRuralType[regionId]
                                const stat = map.statData('gdpChange').get(regionId)
                                const buf = [
                                    `
                                    <div class="em-tooltip-bar">
                                        <b>${regionName}</b>${regionId ? ` (${regionId})` : ''}
                                    </div>
                                    <div class="em-tooltip-text no-data">
                                        <table class="em-tooltip-table">
                                            <tbody>
                                                <tr><td>`,
                                ]

                                buf.push(config.urbanRuralLabels[typology] || map.noDataText_)
                                buf.push('<br>')

                                if (!stat || stat.value === ':' || !Number.isFinite(Number(stat.value))) {
                                    buf.push(map.noDataText_)
                                } else {
                                    const sign = Number(stat.value) > 0 ? '+' : ''
                                    buf.push(`${sign}${stat.value} percentage points`)
                                }

                                buf.push(`</td></tr>
                                            </tbody>
                                        </table>
                                    </div>`)
                                return buf.join('')
                            },
                        })
                        .build()
                })
            }

            function renderSharedScale(colorsByTypology, maxAbsoluteChange) {
                const scale = document.getElementById('gdp-shared-scale')
                const roundedMaximum = Math.ceil(maxAbsoluteChange)
                const scaleRows = [
                    ['Urban', colorsByTypology[1]],
                    ['Intermediate', colorsByTypology[2]],
                    ['Rural', colorsByTypology[3]],
                ]
                scale.innerHTML = `
                    <div class="gdp-shared-scale-title">GDP change (percentage points)</div>
                    ${scaleRows
                        .map(
                            ([label, colors]) => `
                                <div class="gdp-shared-scale-row">
                                    <span class="gdp-shared-scale-row-label">${label}</span>
                                    <div class="gdp-shared-scale-colors">
                                        ${colors.map((color) => `<span style="background:${color}"></span>`).join('')}
                                    </div>
                                </div>`
                        )
                        .join('')}
                    <div class="gdp-shared-scale-labels">
                        <span>−${roundedMaximum}</span>
                        <span>0</span>
                        <span>+${roundedMaximum}</span>
                    </div>`
            }

            buildMap().catch((error) => console.error(error))
        </script>
    </body>
</html>
