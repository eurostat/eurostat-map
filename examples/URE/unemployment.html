<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Unemployment rate</title>
        <style>
            body {
                margin: 0;
                padding: 0px;
                font-family: Arial, sans-serif;
            }
            .controls {
                padding: 15px;
                display: flex;
                gap: 20px;
                align-items: center;
                flex-wrap: wrap;
            }
            .control-group {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            label {
                font-weight: bold;
            }
            select {
                padding: 5px 10px;
                font-size: 14px;
                border-radius: 4px;
                border: 1px solid #ccc;
            }
            .toggle-switch {
                position: relative;
                display: inline-block;
                width: 50px;
                height: 24px;
            }
            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #ccc;
                transition: 0.4s;
                border-radius: 24px;
            }
            .slider:before {
                position: absolute;
                content: '';
                height: 18px;
                width: 18px;
                left: 3px;
                bottom: 3px;
                background-color: white;
                transition: 0.4s;
                border-radius: 50%;
            }
            input:checked + .slider {
                background-color: #2196f3;
            }
            input:checked + .slider:before {
                transform: translateX(26px);
            }
            .em-grid-cell rect {
                stroke: #999 !important;
                stroke-width: 0px !important;
            }
        </style>
    </head>

    <body>
        <div class="controls">
            <div class="control-group">
                <label for="sex-select">Dimension:</label>
                <select id="sex-select">
                    <option value="total">Total</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="control-group">
                <label for="cartogram-toggle">Grid Cartogram</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="cartogram-toggle" checked />
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-group">
                <label for="width-total-toggle">Bar width = population</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="width-total-toggle" />
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <script src="../../build/eurostatmap.js"></script>

        <script>
            const DATA_FILE = 'data/F14 Unemployment_degurba_2025.json'
            const POPULATION_FILE = '../cartogram/grid/data/degurba/population.json'
            const COUNTRY_TO_ISO2 = {
                Austria: 'AT',
                Belgium: 'BE',
                Bulgaria: 'BG',
                Croatia: 'HR',
                Cyprus: 'CY',
                Czechia: 'CZ',
                Denmark: 'DK',
                Estonia: 'EE',
                Finland: 'FI',
                France: 'FR',
                Germany: 'DE',
                Greece: 'EL',
                Hungary: 'HU',
                Ireland: 'IE',
                Italy: 'IT',
                Latvia: 'LV',
                Lithuania: 'LT',
                Luxembourg: 'LU',
                Malta: 'MT',
                Netherlands: 'NL',
                Norway: 'NO',
                Poland: 'PL',
                Portugal: 'PT',
                Romania: 'RO',
                Slovakia: 'SK',
                Slovenia: 'SI',
                Spain: 'ES',
                Sweden: 'SE',
                Switzerland: 'CH',
                EU: 'EU27_2020',
            }

            const config = {
                title: 'Unemployment rate',
                subtitle: 'Share of people aged 15-74, by degree of urbanisation, 2025',
                legendTitle: 'Degree of urbanisation',
                unitText: '%',
                sizeLegendTitle: '% of people aged 15-74',
                noDataRegions: ['IS', 'UK', 'LI', 'BA', 'ME', 'AL', 'MK', 'TR', 'MD', 'GE', 'UA'],
                dimensions: {
                    total: 'Total',
                    male: 'Male',
                    female: 'Female',
                },
            }

            let map = null
            let isCartogram = true
            let useTotalPopWidth = false
            let selectedDimension = 'total'

            function normalizeData(rawData, dimension) {
                const out = {}
                const normalizeValue = (value) => {
                    if (value === null || value === undefined || value === '') return ':'
                    return Number.isNaN(value) ? ':' : value
                }

                for (const entry of rawData.data || []) {
                    const iso2 = COUNTRY_TO_ISO2[entry.country]
                    const values = entry[dimension]
                    if (!iso2 || iso2 === 'EU27_2020' || !values) continue
                    out[iso2] = {
                        DEG1: normalizeValue(values.cities),
                        DEG2: normalizeValue(values.towns_suburbs),
                        DEG3: normalizeValue(values.rural),
                    }
                }
                return out
            }

            async function buildMap(useCartogram) {
                isCartogram = useCartogram

                const [response, populationResponse] = await Promise.all([fetch(DATA_FILE), fetch(POPULATION_FILE)])
                const rawData = await response.json()
                const populationData = await populationResponse.json()
                const data = normalizeData(rawData, selectedDimension)
                const dimLabel = config.dimensions[selectedDimension]

                if (map) {
                    const svg = document.getElementById('bar')
                    if (svg) {
                        svg.innerHTML = ''
                    }
                }

                const GROUP_MAX_HEIGHT = useCartogram ? 48 : 45
                let mapBuilder = eurostatmap
                    .map('bar')
                    .dorling(true)
                    .hoverColor('#ffffbf')
                    .dorling(!useCartogram)
                    .gridCartogram(useCartogram)
                    .gridCartogramSettings({
                        spacing: 0,
                        cellPadding: 12,
                        margins: { top: 5, right: 100, bottom: 0, left: 0 },
                        positions: `
                                    ,IS,  ,  ,NO,SE,FI,  ,  ,  ,  ,  ,
                                    ,  ,  ,  ,  ,  ,  ,EE,  ,  ,  ,  ,
                                    ,  ,  ,  ,  ,  ,  ,LV,  ,  ,  ,  ,
                                    ,IE,  ,  ,  ,DK,  ,LT,  ,  ,  ,  ,
                                    ,  ,  ,  ,NL,DE,PL,  ,  ,  ,  ,  ,
                                    ,  ,  ,BE,LU,CZ,SK,UA,  ,  ,  ,  ,
                                    ,  ,FR,CH,LI,AT,HU,RO,MD,  ,  ,  ,
                                    ,PT,ES,  ,IT,SI,HR,RS,BG,  ,  ,  ,
                                    ,  ,  ,  ,  ,  ,BA,ME,MK,  ,  ,  ,  
                                    ,  ,  ,  ,  ,  ,  ,AL,EL,TR,GE,  ,  
                                    ,  ,  ,  ,MT,  ,  ,  ,  ,CY,  ,  ,  `,
                        countryLabels: 'name',
                        countryLabelPadding: { x: 2, y: -3 },
                        countryLabelFontSize: 11,
                    })
                    .svgId('bar')
                    .scale('60M')
                    .nutsLevel(0)
                    .stat('degurbaRate', {
                        customData: data,
                        categoryCodes: ['DEG1', 'DEG2', 'DEG3'],
                        unitText: config.unitText,
                    })
                    .stat('degurbaPop', {
                        customData: populationData,
                        categoryCodes: ['DEG1', 'DEG2', 'DEG3'],
                        unitText: 'inhabitants',
                    })
                    .encoding('height', {
                        stat: 'degurbaRate',
                        scale: 'linear',
                        range: [2, GROUP_MAX_HEIGHT],
                    })
                    .encoding('color', {
                        stat: 'degurbaRate',
                        by: 'category',
                        values: {
                            DEG1: '#33A033',
                            DEG2: '#8F741A',
                            DEG3: '#E04040',
                        },
                        labels: {
                            DEG1: 'Cities',
                            DEG2: 'Towns and suburbs',
                            DEG3: 'Rural areas',
                        },
                    })
                    .barSettings({
                        groupMaxHeight: GROUP_MAX_HEIGHT,
                    })
                    .title(config.title + ' - ' + dimLabel)
                    .header(true)
                    .footer(true)
                    .subtitle(config.subtitle + ' (' + dimLabel + ')')
                    .legend({
                        position: 'top right',
                        boxOpacity: 0.8,
                        boxFill: 'white',
                        sizeLegend: {
                            title: config.sizeLegendTitle,
                            titlePadding: 10,
                        },
                        widthLegend: {
                            title: 'Population',
                            values: [4000000, 10000000, 35000000],
                        },
                        colorLegend: {
                            title: config.legendTitle,
                            noData: false,
                        },
                    })
                    .patternFill({
                        pattern: 'hatching',
                        color: '#000000',
                        strokeWidth: 0.2,
                        spacing: 15,
                        regionIds: config.noDataRegions,
                        legendLabel: 'Data unavailable',
                    })
                    .noDataFillStyle('#ffffff')
                    .zoomButtons(false)

                if (useTotalPopWidth) {
                    mapBuilder = mapBuilder.encoding('width', {
                        stat: 'degurbaPop',
                        scale: 'linear',
                        range: [useCartogram ? 3 : 2, useCartogram ? 16 : 9],
                    })
                }

                map = mapBuilder
                map.build()
            }

            buildMap(true)

            document.getElementById('sex-select').addEventListener('change', function (e) {
                selectedDimension = e.target.value
                buildMap(isCartogram)
            })

            document.getElementById('cartogram-toggle').addEventListener('change', function (e) {
                buildMap(e.target.checked)
            })

            document.getElementById('width-total-toggle').addEventListener('change', function (e) {
                useTotalPopWidth = e.target.checked
                buildMap(isCartogram)
            })
        </script>
    </body>
</html>
