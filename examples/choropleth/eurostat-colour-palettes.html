<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Eurostat colour palettes</title>
        <style>
            body {
                margin: 0;
                padding: 8px;
            }

            #swatches {
                display: flex;
                height: 14px;
            }

            #swatches span {
                flex: 1;
            }
        </style>
    </head>

    <body>
        <svg id="map"></svg>

        <script src="../../build/eurostatmap.js"></script>
        <script type="module">
            // the reusable settings panel (Eurostat UI components), shared by the examples
            import { createPanel } from '../vendor/example-panel.js'

            const state = { palette: 'teal', classes: 7, type: 'discrete', stretch: 'linear', pivot: 0 }
            // diverging schemes join two hues, e.g. 'cobalt-plum'; single hues are just 'teal'
            const isDiverging = () => state.palette.includes('-')
            let map

            // Class breaks for population change (‰), evenly spaced and always including 0, so 0 (the default
            // point of divergence) is a break: the classes below it step to one hue, those above to the other.
            function changeBreaks(classes) {
                const step = { 3: 5, 4: 5, 5: 5, 6: 4, 7: 3, 8: 3, 9: 2.5 }[classes]
                const count = classes - 1 // number of breaks
                const below = Math.floor(count / 2)
                return Array.from({ length: count }, (_, i) => (i - below) * step)
            }

            // single hues suit a measure that only increases (density); diverging schemes need a midpoint (change)
            const datasets = {
                sequential: {
                    title: 'Population density in Europe',
                    subtitle: '2021',
                    stat: { eurostatDatasetCode: 'demo_r_d3dens', unitText: ' people/km²', filters: { TIME: '2021' } },
                    legendTitle: 'Density, people/km²',
                    unit: 'people/km²',
                },
                diverging: {
                    title: 'Population change in Europe',
                    subtitle: 'Crude rate of total population change, 2024',
                    nutsYear: 2024,
                    stat: { eurostatDatasetCode: 'demo_r_gind3', filters: { indic_de: 'GROWRT', time: 2024 }, unitText: ' ‰' },
                    legendTitle: 'Per 1 000 persons',
                    unit: '‰',
                },
            }

            const panel = createPanel({ map: '#map', title: 'Colour palette settings' })
            panel.select({
                id: 'palette',
                label: 'Colour palette',
                value: state.palette,
                options: [
                    [
                        { value: 'cornflower', label: 'Cornflower' },
                        { value: 'cobalt', label: 'Cobalt' },
                        { value: 'darkOrchid', label: 'Dark orchid' },
                        { value: 'fuchsia', label: 'Fuchsia' },
                        { value: 'berry', label: 'Berry' },
                        { value: 'sunsetRed', label: 'Sunset red' },
                        { value: 'sienna', label: 'Sienna' },
                        { value: 'darkGold', label: 'Dark gold' },
                        { value: 'forestGreen', label: 'Forest green' },
                        { value: 'teal', label: 'Teal' },
                        { value: 'plum', label: 'Plum' },
                    ],
                    [
                        { value: 'cobalt-plum', label: 'Cobalt – plum' },
                        { value: 'cobalt-sienna', label: 'Cobalt – sienna' },
                        { value: 'cobalt-darkGold', label: 'Cobalt – dark gold' },
                        { value: 'cobalt-sunsetRed', label: 'Cobalt – sunset red' },
                        { value: 'cornflower-sienna', label: 'Cornflower – sienna' },
                        { value: 'cornflower-berry', label: 'Cornflower – berry' },
                        { value: 'teal-plum', label: 'Teal – plum' },
                        { value: 'teal-berry', label: 'Teal – berry' },
                        { value: 'teal-sunsetRed', label: 'Teal – sunset red' },
                        { value: 'teal-sienna', label: 'Teal – sienna' },
                        { value: 'forestGreen-plum', label: 'Forest green – plum' },
                        { value: 'forestGreen-berry', label: 'Forest green – berry' },
                        { value: 'darkOrchid-darkGold', label: 'Dark orchid – dark gold' },
                    ],
                ],
                onChange: (v) => {
                    state.palette = v
                    render()
                },
            })
            panel.add('<div id="swatches" aria-hidden="true"></div>')
            panel.radio({
                id: 'type',
                label: 'Colour scheme',
                value: state.type,
                options: [
                    { value: 'discrete', label: 'Discrete (classes)' },
                    { value: 'continuous', label: 'Continuous' },
                ],
                onChange: (v) => {
                    state.type = v
                    render()
                },
            })
            panel.select({
                id: 'classes',
                label: 'Number of classes',
                value: state.classes,
                options: [3, 4, 5, 6, 7, 8, 9].map((n) => ({ value: n, label: String(n) })),
                onChange: (v) => {
                    state.classes = +v
                    render()
                },
            })
            panel.select({
                id: 'stretch',
                label: 'Colour stretching',
                value: state.stretch,
                options: [
                    { value: 'linear', label: 'Linear' },
                    { value: 'sqrt', label: 'Square root' },
                    { value: 'cbrt', label: 'Cube root' },
                    { value: 'log', label: 'Logarithmic' },
                ],
                onChange: (v) => {
                    state.stretch = v
                    render()
                },
            })
            panel.range({
                id: 'pivot',
                label: 'Point of divergence',
                min: -20,
                max: 20,
                step: 0.5,
                value: state.pivot,
                unit: '‰',
                onChange: (v) => {
                    state.pivot = v
                    render()
                },
            })

            const oneDecimal = (v) => v.toLocaleString('en', { maximumFractionDigits: 1 })

            // Once the data is in: in discrete mode the slider steps through the class breaks, so the point of
            // divergence is always one of them (it is then exactly the break shown in the legend); in
            // continuous mode it is any value in the range of the data.
            function updatePivotSlider() {
                const slider = panel.control('pivot')
                if (state.type === 'continuous') {
                    const data = map.statData('value')
                    slider.configure({ steps: null, min: Math.floor(data.getMin()), max: Math.ceil(data.getMax()), step: 0.5, value: state.pivot, format: oneDecimal })
                    return
                }
                const classifier = map.classifier()
                const breaks = Array.from({ length: state.classes - 1 }, (_, i) => classifier.invertExtent(i)[1])
                // the break nearest to the current choice (0 at first)
                const nearest = breaks.reduce((best, b) => (Math.abs(b - state.pivot) < Math.abs(best - state.pivot) ? b : best))
                slider.configure({ steps: breaks, value: nearest, format: oneDecimal })
                if (nearest !== state.pivot && isDiverging()) {
                    // draw again with the point of divergence on a break
                    state.pivot = nearest
                    render()
                }
            }

            function showSwatches() {
                const strip = document.getElementById('swatches')
                if (state.type === 'continuous') {
                    // sample the colour function; in a diverging scheme the neutral sits at 0.5
                    const f = map.colorFunction()
                    strip.style.background = `linear-gradient(to right, ${Array.from({ length: 21 }, (_, i) => f(i / 20)).join(',')})`
                    strip.replaceChildren()
                } else {
                    strip.style.background = ''
                    strip.replaceChildren(
                        ...map.colors().map((color) => {
                            const swatch = document.createElement('span')
                            swatch.style.background = color
                            swatch.title = color
                            return swatch
                        })
                    )
                }
            }

            // build the map with the chosen palette, scheme type and point of divergence
            function render() {
                // controls that only apply to some choices
                panel.show('classes', state.type === 'discrete')
                panel.show('stretch', state.type === 'continuous') // spreads the colours over the values: sqrt and log lift the low end
                panel.show('pivot', isDiverging())

                const dataset = isDiverging() ? datasets.diverging : datasets.sequential
                document.getElementById('map').replaceChildren()
                map = eurostatmap
                    .map('choropleth')
                    .title(dataset.title)
                    .width(800)
                    .subtitle(dataset.subtitle)
                    .nutsLevel(2)
                    .stat('value', dataset.stat)
                    .encoding('fill', { stat: 'value' })
                    .legend({ x: 10, y: 130, title: dataset.legendTitle, boxOpacity: 0 })
                    .colorSchemeType(state.type)
                    .colorStretch(state.stretch)
                    .numberOfClasses(state.classes)
                    .colors(state.palette) // a palette name, e.g. 'teal' or 'cobalt-plum'
                if (dataset.nutsYear) map.nutsYear(dataset.nutsYear)
                if (isDiverging() && state.type === 'discrete') map.classificationMethod('threshold').threshold(changeBreaks(state.classes))
                if (isDiverging()) map.pointOfDivergence(state.pivot) // where the neutral colour sits
                map.callback(() => {
                    // once the data has arrived and the classes are known
                    if (isDiverging()) updatePivotSlider()
                    showSwatches()
                })
                map.build()
            }

            render()
        </script>
    </body>
</html>
