<!doctype html>
<html lang="en">
    <head>
        <title>Bivariate Choropleth</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body>
        <svg id="map"></svg>
        <!-- <script src="../../build/eurostatmap.js"></script> -->
        <script src="../../build/eurostatmap.js"></script>
        <script src="https://unpkg.com/d3"></script>
        <script>
            const n = 3
            const map = eurostatmap
                .map('chbi')
                .scale('60M')
                .position({ x: 4800000, y: 3600000, z: 6500 })
                .title('Unemployment and population density')
                .subtitle('% people unemployed aged 20-64 years & inhabitants per km², 2023')
                .showZoomButtons(true)
                .nutsLevel(2)
                .startColor('#F3E6E2')
                .color1('#327BA8')
                .color2('#DC530D')
                .endColor('#2D2C0A')
                .stat('population-density', {
                    eurostatDatasetCode: 'demo_r_d3dens',
                    unitText: 'inh./km²',
                    filters: { time: 2024 },
                })
                .encoding('x', { stat: 'population-density' })
                .stat('unemployment', {
                    eurostatDatasetCode: 'lfst_r_lfu3rt',
                    filters: { age: 'Y20-64', sex: 'T', unit: 'PC', time: 2024 },
                    unitText: '% unemployed',
                })
                .encoding('y', { stat: 'unemployment' })
                .numberOfClasses(n)
                .legend({
                    label1: 'Inhabitants per km²',
                    label2: '% unemployed',
                    showAxisExtremes: false,
                    annotations: {
                        topLeft: 'Low density &<br> High unemployment',
                        topRight: 'High density &<br> High unemployment',
                        //bottomLeft: 'Low density &<br> Low unemployment',
                        bottomRight: 'High density &<br> Low unemployment',
                    },
                    position: 'top-right',
                    noData: false,
                })
                .noDataFillStyle('#bfbfbf')
                .zoomExtent([0.9, 100])
                .build()
        </script>
    </body>
</html>
