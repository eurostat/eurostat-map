<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Proportional Pie Charts</title>
    </head>

    <body>
        <svg id="map"></svg>
        <script src="../../build/eurostatmap.js"></script>

        <script>
            const ourMap = eurostatmap
                .map('pie')
                .dorling(true)
                .header(true)
                .footer(true)
                .title('Livestock in the EU, 2024')
                .subtitle('Number of animals (pie size) and type of animal (color), 2024')
                .scale('60M')
                .compositionSettings({
                    type: 'pie',
                    otherColor: '#FFCC80',
                    otherText: 'Other',
                    minSize: 6,
                    maxSize: 20,
                })
                .nutsLevel(1)
                .stat('composition', {
                    eurostatDatasetCode: 'apro_mt_ls_r',
                    filters: { unit: 'THS_HD', time: '2024' },
                    unitText: 'heads',
                    categoryParameter: 'animals',
                    categoryCodes: ['A2000', 'A3100', 'A4100', 'A4200'],
                    categoryLabels: ['Bovines', 'Pigs', 'Sheep', 'Goats'],
                    categoryColors: ['#0060FA', '#E04040', '#33A033', '#BF9500'],
                    transform: (value) => value * 1000, // convert from 1000 heads to heads
                })
                .encoding('composition', { stat: 'composition' })

                .legend({
                    boxOpacity: 1,
                    boxFill: 'white',
                    titleFontWeight: 'bold',
                    sizeLegend: {
                        title: 'Number of animals',
                        titlePadding: 10,
                        values: [13000000, 500000],
                    },
                    colorLegend: {
                        title: 'Type of animal',
                        noData: false,
                    },
                })
                .build()
        </script>
    </body>
</html>
