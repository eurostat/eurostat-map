<!doctype html>
<html lang="en">
    <head>
        <title>Maritime ports map</title>
        <meta charset="UTF-8" />
        <meta name="author" content="GISCO - Eurostat" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./ports.css" />
    </head>

    <body style="margin: 0">
        <div>
            <button id="toggle-edit-mode-btn" type="button">Toggle edit mode</button>
            <button id="export-annotations-btn" type="button">Export Annotations</button>
            |
            <button id="export-png-btn" type="button">Export map as PNG</button>
            <button id="export-svg-btn" type="button">Export map as SVG</button>
        </div>
        <div>
            <svg id="ports-map"></svg>
        </div>

        <svg style="display: none">
            <!-- used for country borders -->
            <defs>
                <filter id="blur-effect" x="-50%" y="-50%" width="150%" height="150%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation=".6" />
                </filter>
            </defs>
        </svg>

        <script src="../../../../../../build/eurostatmap.js"></script>
        <script src="../../../../d3.v7.min.js"></script>
        <script src="../../../../proj4-src.js"></script>
        <script src="./portsData.js"></script>
        <script src="./insetsStatic.js"></script>
        <script src="./projections.js"></script>
        <script src="./exportAnnotations.js"></script>

        <script type="module" id="our-map">
            const portsAnnotations = await (await fetch('./ports-annotations.json')).json()
            const portsWidth = 1080 //social media size
            const portsHeight = 850
            const insetsX = portsWidth - 120
            const insetsY = 10

            const getApproxCurrentGeoBbox = function () {
                const defaultPosition = { x: 4790000, y: 3420000 }
                const halfWidth = 0.5 * defaultPosition.z * portsWidth
                const halfHeight = 0.5 * defaultPosition.z * portsHeight
                return [defaultPosition.x - halfWidth, defaultPosition.y - halfHeight, defaultPosition.x + halfWidth, defaultPosition.y + halfHeight]
            }

            const portsProjection = d3.geoIdentity().reflectY(true).fitSize([portsWidth, portsHeight], getBBOXAsGeoJSON(getApproxCurrentGeoBbox()))
            const portsSizeData = indexByCode([...portsData])
            for (const annotation of portsAnnotations) {
                const tonnes = portsSizeData[annotation.portCode]
                annotation.note.label = (tonnes / 1e6).toFixed(1) + ' Mt'
            }
            window.portsAnnotations = portsAnnotations
            let editMode = false
            const map = eurostatmap
                .map('ps')
                .header(true)
                .footer(true)
                .svgId('ports-map')
                .height(portsHeight) //social media size
                .width(portsWidth)
                .hoverColor('#ffc700')
                .insets(insets)
                .insetBoxPosition([insetsX, insetsY])
                .showEstatLogo(true)
                .showEstatRibbon(true)
                .logoPosition([2, portsHeight + 40])
                .ribbonPosition([portsWidth - 180, portsHeight + 35])
                .ribbonWidth(300)
                .ribbonHeight(50)
                .nutsLevel(0)
                .psSettings({
                    fill: 'rgba(0, 114, 67,1)',
                    minSize: 3,
                    maxSize: 30,
                    strokeWidth: 0.9,
                })
                .title('Main cargo ports by gross weight of goods handled, 2025')
                .subtitle('(million tonnes)')
                .footnote(
                    "Note: the map shows data for the ports with at least 2 million tonnes of freight handled (inward and outward combined). Ports reporting more than 47 million tonnes are labelled. Estonia does not disseminate port data.<br><tspan style='font-style: italic;'>Source</tspan>: Eurostat (mar_mg_aa_pwhd)"
                )
                .footnoteWrap(100)
                //.footnotePosition([15, portsHeight - 15])
                .legend({
                    title: 'Million tonnes',
                    x: 10,
                    y: 240,
                    sizeLegend: {
                        values: [portsData[0].tonnes_2025, 100000000, 2000000],
                        labels: ['390 (Rotterdam)', '100', '2'],
                    },
                })
                .filterGeometriesFunction((geometries) => {
                    //remove greenland to stop title overlap
                    let nuts2json = geometries[0]
                    let countries = nuts2json.objects.cntrg.geometries
                    countries = countries.filter((f) => {
                        if (f.properties.id !== 'GL' && f.properties.na !== 'Greenland') {
                            return f
                        } else {
                            return false
                        }
                    })
                    nuts2json.objects.cntrg.geometries = countries

                    // add ports to centroids array
                    // each port location must be reprojected to the map projection
                    let centroids = geometries[1]
                    ;[...portsData].forEach((d) => {
                        let newCentroid
                        if (d.code === 'PT00PTPDL') {
                            newCentroid = {
                                type: 'Feature',
                                geometry: { coordinates: to32626([d.lon, d.lat]), type: 'Point' },
                                properties: { id: d.code, na: d.name },
                            }
                        } else if (d.code == 'ES02ESLPA') {
                            // handle canarias (inset map)
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32628([d.lon, d.lat]), // IC_32628 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else if (d.code == 'FR04GPPTP') {
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32620([d.lon, d.lat]), // GP_32620 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else if (d.code == 'FR04MQFDF') {
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32620([d.lon, d.lat]), // MQ_32620 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else if (d.code == 'FR05RELPT') {
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32740([d.lon, d.lat]), // RE_32740 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else {
                            let coords = to3035([d.lon, d.lat])
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: coords,
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: portsProjection(coords),
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        }

                        centroids.features.push(newCentroid)
                    })
                    return geometries
                })
                .zoomButtons(false)
                // Estonia reports maritime transport (so it has the maritime-country green) but does not disseminate port data: hatch it
                .patternFill({ regionIds: ['EE'], pattern: 'hatching', color: '#7fbf96', strokeWidth: 1.2, spacing: 5, legendLabel: 'Port data not disseminated' })
                .onBuild(() => {
                    const portKeys = Object.keys(portsSizeData)
                    //color regions
                    d3.selectAll('#ports-map .em-nutsrg path:not(.pattern-fill-overlay)').style('fill', (d) => {
                        const iso = d.properties.id // e.g. "NL"

                        // Check if ANY port key starts with this ISO
                        const hasPort = portKeys.some((k) => k.startsWith(iso)) || iso == 'EL' || iso == 'EE' // Estonia reports maritime transport but not port data

                        return hasPort ? 'rgba(162, 221, 178,0.4)' : '#f2f2f2'
                    })
                    // Estonia's country shape (what shows where a country has no NUTS data) gets the same green
                    d3.select('#ports-map #em-cntrg-EE').style('fill', 'rgba(162, 221, 178,0.4)')
                    // --- REMOVE if it already exists ---
                    d3.select('#ports-map #em-footnote-2').remove()

                    d3.selectAll('#ports-map')
                        .append('text')
                        .attr('x', portsWidth - 315)
                        .attr('y', portsHeight + 100)
                        .attr('class', 'em-footnote')
                        .attr('id', 'em-footnote-2')
                        .append('tspan')
                        .html('Cartography: GISCO, Boundaries: ©EuroGeographics ©OSM')

                })
                .annotations({ editMode: editMode, annotations: portsAnnotations })
                .tooltip({
                    textFunction: tooltipTextFunction,
                })
                .build()

            map.statData('size').setData(portsSizeData)

            // The ports are drawn asynchronously and their circles grow to size in a transition. Wait until every callout's
            // circle has a size that has stopped changing, then put the end of each line on its circle and redraw.
            const portRadii = () =>
                window.portsAnnotations.map((a) => Number(document.querySelector(`#ports-map [id="ps${a.portCode}"] circle`)?.getAttribute('r')))
            const snapWhenDrawn = (previous = [], attempts = 100) => {
                const radii = portRadii()
                const settled = radii.every((r) => r > 0) && radii.every((r, i) => r === previous[i])
                if (settled || attempts === 0) {
                    snapAnnotationsToPorts(window.portsAnnotations)
                    map.annotations({ editMode: editMode, annotations: window.portsAnnotations })
                } else setTimeout(() => snapWhenDrawn(radii, attempts - 1), 200)
            }
            snapWhenDrawn()

            /**
             * Anchor every callout on the edge of its port's circle, so the line touches it, and touches only it.
             * The note keeps the place it was given; only the end of the line moves, to the point of the circle's edge
             * nearest the direction of the note that no other port circle is drawn over (the big ports overlap their
             * neighbours: Rotterdam's edge is largely covered by Antwerp-Bruges and the smaller ports around it, and a
             * line ending there would look like it belonged to them). Positions come from the drawn circles (insets
             * included), so this stays right when the data, the symbol sizes or the map position change.
             */
            function snapAnnotationsToPorts(annotations) {
                const svg = document.getElementById('ports-map')
                const toGroup = svg.querySelector('#em-zoom-group-ports-map').getScreenCTM().inverse()
                const measure = (circle) => {
                    const toScreen = circle.getScreenCTM()
                    const centre = new DOMPoint(0, 0).matrixTransform(toScreen).matrixTransform(toGroup)
                    return { circle, x: centre.x, y: centre.y, r: Number(circle.getAttribute('r')) * toScreen.a * toGroup.a }
                }
                const circles = [...svg.querySelectorAll('g.em-centroid circle')].map(measure).filter((c) => c.r > 0)
                const step = Math.PI / 90 // 2 degrees
                for (const a of annotations) {
                    const own = circles.find((c) => c.circle.parentNode.id === `ps${a.portCode}`)
                    if (!own) continue
                    // circles drawn after this one (later in the document) are on top of it
                    const above = circles.filter(
                        (c) =>
                            c !== own &&
                            Math.hypot(c.x - own.x, c.y - own.y) < c.r + own.r &&
                            own.circle.compareDocumentPosition(c.circle) & Node.DOCUMENT_POSITION_FOLLOWING
                    )
                    const covered = (x, y) => above.some((c) => Math.hypot(x - c.x, y - c.y) < c.r + 0.5)
                    const noteX = a.x + a.dx
                    const noteY = a.y + a.dy
                    const facing = Math.atan2(noteY - own.y, noteX - own.x)
                    // the uncovered point of the edge closest to the direction of the note (all of it, if nothing is free)
                    let best = facing
                    for (let i = 0; i <= 90; i++) {
                        const free = [facing + i * step, facing - i * step].find((angle) => !covered(own.x + own.r * Math.cos(angle), own.y + own.r * Math.sin(angle)))
                        if (free !== undefined) {
                            best = free
                            break
                        }
                    }
                    a.x = own.x + own.r * Math.cos(best)
                    a.y = own.y + own.r * Math.sin(best)
                    a.dx = noteX - a.x
                    a.dy = noteY - a.y
                }
            }

            var editModeBtn = document.getElementById('toggle-edit-mode-btn')
            editModeBtn.addEventListener('click', function () {
                editMode = !editMode
                snapAnnotationsToPorts(window.portsAnnotations)
                map.annotations({ editMode: editMode, annotations: window.portsAnnotations })
            })

            var exportBtnPNG = document.getElementById('export-png-btn')
            exportBtnPNG.addEventListener('click', function () {
                map.exportMapToPNG(undefined, undefined, 'maritime-ports-2025')
            })

            var exportBtnSVG = document.getElementById('export-svg-btn')
            exportBtnSVG.addEventListener('click', function () {
                map.exportMapToSVG('maritime-ports-2025')
            })

            function tooltipTextFunction(region, map) {
                if (map.tooltip_.omitRegions && map.tooltip_.omitRegions.includes(region.properties.id)) {
                    return '' // Skip tooltip for omitted regions
                }

                const regionName = region.properties.na
                const regionId = region.properties.id

                // Stat 1
                const v1 = map.statData('size').getArray() ? map.statData('size') : map.statData()
                const sv1 = v1.get(region.properties.id)
                const unit1 = v1.unitText?.() || ''
                const row1 = `<tr><td>${(sv1?.value / 1000000).toFixed(1) + ' million tonnes'}</td></tr>`

                return `
    <div class="em-tooltip-bar">
      <b>${regionName}</b>${regionId ? ` (${regionId})` : ''}
    </div>
    <div class="em-tooltip-text">
      <table class="em-tooltip-table">
        <tbody>
          ${row1}
        </tbody>
      </table>
    </div>
  `.trim()
            }
        </script>
    </body>
</html>
