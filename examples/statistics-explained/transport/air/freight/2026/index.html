<!doctype html>
<html lang="en">
    <head>
        <title>Air freight map</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            @import url('./air-freight.css');
        </style>
    </head>

    <body style="margin: 0">
        <div>
            <button id="export-png-btn" type="button">Export map as PNG</button>
            <button id="export-svg-btn" type="button">Export map as SVG</button>
        </div>
        <svg id="air-freight-map"></svg>

        <svg style="display: none">
            <!-- used for country borders -->
            <defs>
                <filter id="blur-effect" x="-50%" y="-50%" width="150%" height="150%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation=".6" />
                </filter>
            </defs>
        </svg>
        <script src="../../../../../../build/eurostatmap.js"></script>
        <script src="../../../../d3.v7.min.js"></script>
        <script src="./regionLabels.js"></script>
        <script src="./regions.js"></script>
        <script src="../../regional-palette.js"></script>
        <script src="../../label-alignment.js"></script>
        <script src="./configs.js"></script>
        <script>
            const year = 2025
            const width = 1080
            const height = width / 1.7
            const worldProjection = d3
                .geoAzimuthalEquidistant()
                .rotate([-10, -10])
                .scale(200)
                .translate([width / 2.4, width / 2.6])

            const makeLegendItems = () =>
                airMapConfigs[year].freight.legend.labels
                    .map((label, i) => ({
                        color: airMapConfigs[year].freight.colors[i],
                        label,
                    }))
                    .reverse()

            fetch(`./airFreightGraph${year}.json`)
                .then((r) => r.json())
                .then((graphData) => {
                    const regionByCountry = new Map(
                        Object.entries(regions).flatMap(([region, codes]) => codes.map((code) => [code, region.toLowerCase()]))
                    )

                    // one decimal everywhere: 3.3M, 812.4K
                    const compactValue = (value) => (value >= 1e6 ? `${(value / 1e6).toFixed(1)}M` : `${(value / 1e3).toFixed(1)}K`)
                    // each flow label reads "3.3M (+3.6%)": the amount, then the change since the year before, so the colour classes are not all a reader has
                    const changeByValue = new Map(graphData.nodes.filter((n) => n.change).map((n) => [n.value, n.change]))
                    const signedChange = (change) => {
                        const pct = parseChangeToPct(change)
                        return `${pct > 0 ? '+' : pct < 0 ? '−' : ''}${Math.abs(pct).toFixed(1)}%`
                    }
                    const valuesLabelFormatter = (value) =>
                        changeByValue.has(value) ? `${compactValue(value)} (${signedChange(changeByValue.get(value))})` : compactValue(value)

                    const colorFunction = d3
                        .scaleThreshold()
                        .domain(airMapConfigs[year].freight.breaks) // ascending thresholds
                        .range(airMapConfigs[year].freight.colors) // length = breaks.length + 1

                    function parseChangeToPct(v) {
                        if (v == null) return NaN
                        const s = String(v).trim()
                        const hasPct = s.includes('%')
                        let n = parseFloat(s.replace('%', ''))
                        if (!hasPct && Math.abs(n) <= 1) n *= 100 // interpret small decimals as fractions
                        return n
                    }

                    const spaceAsThousandSeparator = function (number) {
                        return number.toLocaleString('en').replace(/,/gi, ' ')
                    }
                    const tooltipFunction = function (link, map) {
                        const buf = []
                        const statData = map.statData()
                        const unit = statData.unitText() || ''

                        // Header with region name and ID
                        const title = `${link.source.name || link.source.id} and ${link.target.name || link.target.id}`
                        buf.push(`
                        <div class="em-tooltip-bar">
                            <b>${title}</b>
                        </div>
                    `)

                        // Value
                        buf.push(`<div class='em-tooltip-text'>
                        <table class="em-tooltip-table">
                            <tbody>
                                <tr><td>Tonnes of freight: ${spaceAsThousandSeparator(link.value)}</td></tr>
                                <tr>
                            <td>
                                Change since ${year - 1}:
                                <span
                                style="
                                    background:${colorFunction(parseChangeToPct(link.target.change))};
                                    color:${getContrastTextColor(colorFunction(parseChangeToPct(link.target.change)))};
                                    padding:2px 4px;
                                    border-radius:3px;
                                "
                                >
                                ${link.target.change}
                                </span>
                            </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>`)

                        return buf.join('')
                    }

                    // sort links by value descending
                    graphData.links.sort((a, b) => b.value - a.value)

                    const map = eurostatmap
                        .map('flow')
                        .svgId('air-freight-map')
                        .hoverColor('#ffc700')
                        .width(width)
                        .height(height)
                        .title('Extra-EU air freight and mail transport, 2025')
                        .subtitle(`Transport of freight and mail between the EU and the rest of the world`)

                        //static settings
                        .header(true)
                        .footer(true)
                        .zoomButtons(false)
                        .showEstatLogo(true)
                        .showEstatRibbon(true)
                        .logoPosition([2, height + 42])
                        .ribbonPosition([width - 180, height + 20])
                        .ribbonWidth(300)
                        .ribbonHeight(50)
                        //end static settings

                        //projection
                        .projectionFunction(worldProjection)

                        //geometries
                        .geo('WORLD')
                        .proj('4326')
                        .scale('60M')

                        // flow settings
                        .flowGraph(graphData)
                        .flowSettings({ minWidth: 4, maxWidth: 40, lineType: 'curved', nodeType: false ? 'donut' : 'circle' })
                        // .flowColor("#72bb6f")
                        .flowSettings({
                            color: (d) => {
                                if (!d.target || !d.target.change) {
                                    console.log(d)
                                    return '#999999'
                                }
                                return colorFunction(parseChangeToPct(d.target.change))
                            },
                        })
                        .flowSettings({ opacity: 1, arrows: false, outlines: true, outlineWidth: 2, outlineColor: 'white', colorGradient: false, widthGradient: false, topLocations: 0, stack: false })
                        //only for when stacked
                        // .flowOrder((a, b) => {
                        //     console.log(a, b);
                        //     // Helper to extract ID whether link.source is object or string
                        //     const getId = (it) =>
                        //         typeof it === "object" ? it.id : it;

                        //     // Extract IDs for a
                        //     const aSrc = getId(a.link?.source);
                        //     const aTgt = getId(a.link?.target);

                        //     // Extract IDs for b
                        //     const bSrc = getId(b.link?.source);
                        //     const bTgt = getId(b.link?.target);

                        //     // Region membership helpers
                        //     const isCentralAsia = (id) => id === "ASI_C";
                        //     const isEasternAsia = (id) => id === "ASI_E";

                        //     // Does link involve either region?
                        //     const aInCentral = isCentralAsia(aSrc) || isCentralAsia(aTgt);
                        //     const bInCentral = isCentralAsia(bSrc) || isCentralAsia(bTgt);

                        //     const aInEastern = isEasternAsia(aSrc) || isEasternAsia(aTgt);
                        //     const bInEastern = isEasternAsia(bSrc) || isEasternAsia(bTgt);

                        //     // --- PRIORITY RULE ---
                        //     // Central Asia ABOVE Eastern Asia
                        //     if (aInCentral && !bInCentral) return -1;  // a above b
                        //     if (bInCentral && !aInCentral) return 1;   // b above a

                        //     if (aInEastern && !bInEastern) return -1;  // Eastern above rest
                        //     if (bInEastern && !aInEastern) return 1;

                        //     // --- FALLBACK ---
                        //     return a.otherY - b.otherY || b.width - a.width;
                        // }
                        // )

                        // legend
                        .legend({
                            x: width - 185,
                            y: 50,
                            boxPadding: 10,
                            boxOpacity: 1,
                            title: 'Freight carried',
                            subtitle: '(tonnes)',
                            flowWidthLegend: {
                                marginTop: -10,
                                values: airMapConfigs[year].freight.legend.sizeLegend.values,
                                labels: airMapConfigs[year].freight.legend.sizeLegend.labels,
                            },
                            flowColorLegend: {
                                marginTop: 50,
                                title: airMapConfigs[year].freight.legend.title,
                                items: makeLegendItems(year),
                            },
                        })

                        //labels
                        .labels({
                            labels: regionLabels,
                            shadows: true,
                            values: true,
                            valuesFormatter: valuesLabelFormatter,
                        })

                        .tooltip({
                            textFunction: tooltipFunction,
                        })

                        .footnote(
                            "Note: Freight includes both loaded and unloaded. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <tspan style='font-style: italic;'>Source</tspan>: Eurostat (avia_goexcc)"
                        )
                        .footnoteWrap(150)

                        // zoom min/max
                        .zoomExtent([0.6, 10])

                        .callback(() => {
                            // set fill of regions
                            const countries = d3.selectAll('#air-freight-map .em-worldrg path')
                            countries.style('fill', (d) => regionalColors[regionByCountry.get(d.properties.id)] ?? '#efefef')
                            // raise labels (fixed in next version of estatmap)
                            const labels = d3.selectAll('#em-labels')
                            labels.raise()
                            // Central Asia: the name starts at the same x as its value, sitting on top of it
                            alignRegionNameToValue('#air-freight-map', 'Central Asia')

                            // these values sit centred on their region name (above or under it), not beside their flow end
                            // where they would run over a neighbouring flow
                            const centreValueOnName = (regionName, placement) => {
                                const nameText = d3
                                    .selectAll('#air-freight-map #em-labels text')
                                    .filter(function () {
                                        return this.textContent.trim() === regionName && !this.closest('.em-flow-label')
                                    })
                                    .node()
                                if (!nameText) return
                                const box = nameText.getBBox()
                                const at = (d) => ({
                                    x: box.x + box.width / 2 - d.x,
                                    y: (placement === 'above' ? box.y - 7 : box.y + box.height + 11) - d.y,
                                })
                                const matches = (d) => d.name === regionName
                                d3.selectAll('#air-freight-map .em-flow-label g')
                                    .filter(matches)
                                    .select('text')
                                    .attr('text-anchor', 'middle')
                                    .attr('x', (d) => at(d).x)
                                    .attr('y', (d) => at(d).y)
                                d3.selectAll('#air-freight-map .em-flow-label-halo text')
                                    .filter(matches)
                                    .attr('text-anchor', 'middle')
                                    .attr('x', (d) => d.x + at(d).x)
                                    .attr('y', (d) => d.y + at(d).y)
                            }
                            centreValueOnName('Europe except EU', 'below')
                            centreValueOnName('Western Asia', 'above')

                            //add cartography text
                            // --- REMOVE if it already exists ---
                            d3.select('#air-freight-map #em-footnote-2').remove()

                            d3.selectAll('#air-freight-map')
                                .append('text')
                                .attr('x', width - 315)
                                .attr('y', height + 95)
                                .attr('class', 'em-footnote')
                                .attr('id', 'em-footnote-2')
                                .append('tspan')
                                .html('Cartography: GISCO, Boundaries: ©EuroGeographics ©OSM')
                        })
                        .build()

                    const exportBtnPNG = document.getElementById('export-png-btn')
                    exportBtnPNG.addEventListener('click', function () {
                        map.exportMapToPNG(1080, Number(map.svg().attr('height')), 'air-freight-2025')
                    })

                    const exportBtnSVG = document.getElementById('export-svg-btn')
                    exportBtnSVG.addEventListener('click', function () {
                        map.exportMapToSVG()
                    })
                })
                .catch((err) => console.error(err))

            function getContrastTextColor(hex) {
                hex = hex.replace('#', '')
                if (hex.length === 3) {
                    hex = hex
                        .split('')
                        .map((c) => c + c)
                        .join('')
                }

                const r = parseInt(hex.substr(0, 2), 16)
                const g = parseInt(hex.substr(2, 2), 16)
                const b = parseInt(hex.substr(4, 2), 16)

                // Perceived luminance
                const luminance = 0.299 * r + 0.587 * g + 0.114 * b

                return luminance > 140 ? 'black' : 'white'
            }
        </script>
    </body>
</html>
