<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Top 10 intra-EU airport pairs, 2025</title>
        <style>
            #airport-pairs-map .em-title {
                font-size: 25px;
            }

            #airport-pairs-map .em-subtitle {
                font-size: 20px;
            }

            /* muted national borders, as in the 2025 map: the flows are the subject, not the country outlines */
            #airport-pairs-map .em-worldbn {
                stroke: grey !important;
                stroke-width: 1.3px !important;
                opacity: 0.5;
            }

            /* passengers and change since 2024, written on each flow: dark text on a white halo reads on every flow colour */
            #airport-pairs-map .flow-value-label {
                font:
                    bold 11px Arial,
                    sans-serif;
                fill: #222222;
                stroke: #ffffff;
                stroke-width: 3px;
                stroke-linejoin: round;
                paint-order: stroke;
                text-anchor: middle;
                dominant-baseline: central;
                pointer-events: none;
            }

            .em-annotations {
                pointer-events: none !important;
            }

            /* the callouts sit on a white box, rounded like the legend, so the flows under them do not run through the text */
            .em-annotations .annotation-note-bg {
                fill-opacity: 1;
                rx: 5px;
                ry: 5px;
                filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.25));
            }

            /* bold dark labels on a thick white halo so they stay readable over the flows and the land */
            #airport-pairs-map .em-label,
            #airport-pairs-map .em-label-halo {
                font:
                    bold 12px Arial,
                    sans-serif;
                text-anchor: start;
            }

            #airport-pairs-map .em-label {
                fill: #333333;
                opacity: 1;
            }

            #airport-pairs-map .em-label-halo {
                stroke: #ffffff;
                stroke-width: 4px;
                stroke-linejoin: round;
                opacity: 0.9;
            }
            .em-map {
                font-family: Arial;
            }
        </style>
    </head>
    <body style="margin: 0">
        <div>
            <button id="export-png-btn" type="button" disabled>Export map as PNG</button>
            <button id="export-svg-btn" type="button" disabled>Export map as SVG</button>
        </div>
        <svg id="airport-pairs-map"></svg>
        <p id="map-error" role="alert" hidden>The airport pairs map could not be loaded.</p>

        <script src="../../../../../../build/eurostatmap.js"></script>
        <script src="../../../../d3.v7.min.js"></script>
        <script>
            async function buildAirportMap() {
                // Source: Map2-Passengers-Airport-Pairs-EU-2024-2025.xlsx, "For map" worksheet.
                const response = await fetch('./airportPairsGraph2025.json')
                if (!response.ok) throw new Error('Unable to load airport pairs data')
                const graph = await response.json()
                const width = 1000
                const height = width / 1.5
                const projection = d3
                    .geoAzimuthalEquidistant()
                    .rotate([2, -35])
                    .scale(1500)
                    .translate([width / 2.4, width / 2.3])
                const formatPassengers = new Intl.NumberFormat('en')
                const millions = (value) => `${(value / 1e6).toFixed(1)}M`
                // "1.8M" over "−13.2%": passengers carried, then the change since 2024, so the colour classes are not all a reader has
                const signedChange = (link) => formatChange.format(link.changePct / 100).replace('-', '−')
                const flowLabel = (link) => [millions(link.value), signedChange(link)]
                const flowValues = graph.links.map((link) => link.value)
                const smallestFlow = Math.min(...flowValues)
                const largestFlow = Math.max(...flowValues)
                const madridFlows = graph.links.filter((link) => link.source === 'LEMD' || link.target === 'LEMD')
                const madridTotal = madridFlows.reduce((total, link) => total + link.value, 0)
                const formatChange = new Intl.NumberFormat('en', {
                    style: 'percent',
                    signDisplay: 'exceptZero',
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1,
                })
                // Diverging, centred on zero: reds fall, blues rise, grey is little change. The grey is darker than the
                // land so that small changes stay visible against it.
                const changeColors = ['#b2182b', '#ef8a62', '#c4c4c4', '#67a9cf', '#2166ac']
                const changeLabels = ['Fall of more than 5%', 'Fall of 1% to 5%', 'Little change (±1%)', 'Rise of 1% to 5%', 'Rise of more than 5%']
                const changeColor = d3.scaleThreshold().domain([-5, -1, 1, 5]).range(changeColors)
                const airportNames = {
                    LEMD: 'Madrid-Barajas',
                    LEBL: 'Barcelona-El Prat',
                    LEPA: 'Palma de Mallorca',
                    LIRF: 'Roma-Fiumicino',
                    LICC: 'Catania',
                    LPPT: 'Lisbon',
                    GCLP: 'Gran Canaria',
                    GCXO: 'Tenerife North',
                    LFPO: 'Paris-Orly',
                }
                const labelOffsets = {
                    LEMD: [-92, -16],
                    LEBL: [17, 12],
                    LEPA: [8, 6],
                    LIRF: [14, -1],
                    LICC: [5, 5],
                    LPPT: [-45, 5],
                    GCLP: [-20, 25],
                    GCXO: [-62, -12],
                    LFPO: [5, 6],
                }
                const airportLabels = graph.nodes.map(({ id, x, y }) => {
                    const [offsetX, offsetY] = labelOffsets[id]
                    const [screenX, screenY] = projection([x, y])
                    const [lon, lat] = projection.invert([screenX + offsetX, screenY + offsetY])
                    return { text: airportNames[id], x: lon, y: lat }
                })

                const png = document.getElementById('export-png-btn')
                const svg = document.getElementById('export-svg-btn')
                eurostatmap
                    .map('flow')
                    .svgId('airport-pairs-map')
                    .width(width)
                    .height(height)
                    .title('Top 10 intra-EU airport pairs, 2025')
                    .subtitle('by passengers carried')
                    .header(true)
                    .footer(true)
                    .showEstatLogo(true)
                    .showEstatRibbon(true)
                    .logoPosition([2, height + 42])
                    .ribbonPosition([width - 180, height + 35])
                    .ribbonWidth(300)
                    .ribbonHeight(50)
                    .zoomButtons(false)
                    .projectionFunction(projection)
                    .geo('WORLD')
                    .proj('4326')
                    .scale('60M')
                    .flowGraph(graph)
                    .flowSettings({
                        minWidth: 3,
                        maxWidth: 15,
                        lineType: 'curved',
                        stack: true,
                        // no airport circles: any size would show only the volume of these ten flows, not the airport's real traffic
                        nodes: false,
                        arrows: false,
                        outlines: true,
                        // constant width along each flow: width encodes the passenger volume, nothing else
                        widthGradient: false,
                        color: (link) => changeColor(link.changePct),
                        curvatureSettings: { gapX: 0, padX: 0, padY: 2, bumpY: 10, curvature: 0.3 },
                        // Order of the flows within each airport's stack, top to bottom. By default they follow the angle to their
                        // other end; where that makes flows that meet at an airport cover each other the wrong way round, stackOrder
                        // lists the airports at the other end of the flows in the order they should be stacked.
                        order: (a, b) => {
                            const stackOrder = {
                                LEMD: ['LPPT', 'GCXO', 'GCLP'], // Madrid: Lisbon, then Tenerife North, then Gran Canaria
                                LIRF: ['LEMD', 'LEBL'], // Rome: Madrid above Barcelona
                                LEPA: ['LEBL', 'LEMD'], // Palma: Barcelona above Madrid
                            }
                            const node = (d) => (d.at === 'out' ? d.link.source : d.link.target).id
                            const otherEnd = (d) => (d.at === 'out' ? d.link.target : d.link.source).id
                            const ranks = stackOrder[node(a)]
                            if (ranks && ranks.includes(otherEnd(a)) && ranks.includes(otherEnd(b)))
                                return ranks.indexOf(otherEnd(a)) - ranks.indexOf(otherEnd(b))
                            const angle = (d) => Math.atan2(d.otherY - d.nodeY, d.otherX - d.nodeX)
                            return angle(a) - angle(b) || (b.link.value ?? 0) - (a.link.value ?? 0)
                        },
                    })
                    .legend({
                        x: width - 225,
                        y: height - 208,
                        boxPadding: 10,
                        boxOpacity: 1,
                        title: 'Passengers carried',
                        flowWidthLegend: {
                            values: [smallestFlow, largestFlow],
                            labels: [millions(smallestFlow), millions(largestFlow)],
                        },
                        flowColorLegend: {
                            marginTop: 40,
                            title: 'Change vs 2024',
                            items: changeColors.map((color, index) => ({ color, label: changeLabels[index] })).reverse(),
                        },
                        regionColorLegend: false,
                    })
                    .minimap({ x: width - 90, y: 170, z: 200, color: 'lightgrey', debounce: 2 })
                    .labels({ labels: airportLabels, shadows: true, hideOverlapping: true })
                    .tooltip({
                        textFunction: (link) => `
                            <div class="em-tooltip-bar"><b>${airportNames[link.source.id]} and ${airportNames[link.target.id]}</b></div>
                            <div class="em-tooltip-text">
                                <table class="em-tooltip-table">
                                    <tr><td>Passengers carried: ${(link.value / 1e6).toFixed(1)} million</td></tr>
                                    <tr><td>Change since 2024: ${formatChange.format(link.changePct / 100)}</td></tr>
                                </table>
                            </div>`,
                    })
                    .annotations({
                        editMode: false,
                        annotations: [
                            {
                                type: 'annotationCalloutCircle',
                                note: {
                                    title: 'Madrid moves millions',
                                    label: `${madridFlows.length} of the top 10 routes either started or ended in Madrid, with a total of over ${Math.floor(madridTotal / 1e5) / 10} million passengers carried.`,
                                    wrap: 210,
                                    bgPadding: 8,
                                    lineType: 'none', // d3-annotation draws a note line only for 'horizontal'/'vertical' (null falls back to the type's): none, so the connector ends at the box
                                },
                                subject: { radius: 30 },
                                connector: { type: 'curve', points: [[-17, -41], [-28, -60]] },
                                x: projection([-3.57, 40.49])[0],
                                y: projection([-3.57, 40.49])[1],
                                dx: -38,
                                dy: -75,
                                color: '#696969',
                            },
                            {
                                note: {
                                    title: 'Busiest intra-EU route',
                                    label: `Barcelona to Mallorca was the busiest route in 2025, with ${(largestFlow / 1e6).toFixed(1)} million passengers carried.`,
                                    wrap: 210,
                                    bgPadding: 8,
                                },
                                connector: { end: 'dot', type: 'curve', points: [[-10, 50]] },
                                x: projection([2.5, 40.3])[0],
                                y: projection([2.5, 40.3])[1],
                                dx: 0,
                                dy: 140,
                                color: '#696969',
                            },
                        ],
                    })
                    .footnote("Note: intra-EU flights only.<br> <tspan font-style='italic'>Source</tspan>: Eurostat (avia_pa)")
                    .onBuild((map) => {
                        // write each flow's passengers and change on the flow, half way along its centre line unless that would put
                        // two labels on top of each other: the fraction of the way along the flow, by index in the graph's links
                        // (each fraction is measured from the flow's source, the first airport of its pair in the graph)
                        const labelPosition = {
                            2: 0.3, // Madrid to Rome, above Barcelona to Rome
                            9: 0.7,
                            6: 0.3, // Tenerife North to Madrid, apart from Madrid to Gran Canaria
                            3: 0.3,
                            5: 0.7, // Madrid to Lisbon, clear of the Madrid circle
                        }
                        const flowLabels = map.svg().select('#em-flow-lines').append('g').attr('class', 'flow-value-labels')
                        map.svg()
                            .selectAll('#em-flow-lines .em-flow-link')
                            .each(function () {
                                const centre = document.createElementNS('http://www.w3.org/2000/svg', 'path')
                                centre.setAttribute('d', this.getAttribute('data-center-path'))
                                // a flow too short to hold its label (Barcelona to Palma) is read from the 'Busiest route' note instead
                                if (centre.getTotalLength() < 70) return
                                const linkIndex = +this.getAttribute('data-link-index')
                                const middle = centre.getPointAtLength(centre.getTotalLength() * (labelPosition[linkIndex] ?? 0.5))
                                const label = flowLabels.append('text').attr('class', 'flow-value-label').attr('x', middle.x).attr('y', middle.y)
                                const [passengers, change] = flowLabel(graph.links[linkIndex])
                                label.append('tspan').attr('x', middle.x).attr('dy', '-0.55em').text(passengers)
                                label.append('tspan').attr('x', middle.x).attr('dy', '1.1em').text(change)
                            })
                        map.svg().select('.em-annotations').raise()
                        map.svg().select('#em-labels').raise()
                        map.svg()
                            .append('text')
                            .attr('class', 'em-footnote')
                            .attr('x', width - 315)
                            .attr('y', height + 105)
                            .text('Cartography: GISCO. Boundaries: ©EuroGeographics ©OSM')
                        png.onclick = () => map.exportMapToPNG(undefined, undefined, 'airport-pairs-2025')
                        svg.onclick = () => map.exportMapToSVG('airport-pairs-2025')
                        png.disabled = false
                        svg.disabled = false
                    })
                    .build()
            }

            buildAirportMap().catch(() => {
                document.getElementById('map-error').hidden = false
            })
        </script>
    </body>
</html>
