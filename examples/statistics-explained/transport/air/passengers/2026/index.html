<!doctype html>
<html lang="en">
    <head>
        <title>Air passengers map</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            @import url('./passengers.css');
        </style>
    </head>

    <body style="margin: 0">
        <div>
            <button id="export-png-btn" type="button">Export map as PNG</button>
            <button id="export-svg-btn" type="button">Export map as SVG</button>
        </div>
        <svg id="air-passengers-map"></svg>

        <svg style="display: none">
            <!-- used for country borders -->
            <defs>
                <filter id="blur-effect" x="-50%" y="-50%" width="150%" height="150%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation=".6" />
                </filter>
            </defs>
        </svg>
        <script src="../../../../../../build/eurostatmap.js"></script>
        <script src="../../../../d3.v7.min.js"></script>
        <script src="./regionLabels.js"></script>
        <script src="./regions.js"></script>
        <script src="../../regional-palette.js"></script>
        <script src="./configs.js"></script>
        <script>
            const year = 2025
            const width = 1080
            const height = width / 1.7
            const worldProjection = d3
                .geoAzimuthalEquidistant()
                .rotate([-10, -10])
                .scale(200)
                .translate([width / 2.4, width / 2.6])

            const makeLegendItems = () =>
                airMapConfigs[year].passengers.legend.labels
                    .map((label, i) => ({
                        color: airMapConfigs[year].passengers.colors[i],
                        label,
                    }))
                    .reverse()

            fetch(`./passengersGraph${year}.json`)
                .then((r) => r.json())
                .then((graphData) => {
                    const regionByCountry = new Map(
                        Object.entries(regions).flatMap(([region, codes]) => codes.map((code) => [code, region.toLowerCase()]))
                    )

                    const valuesLabelFormatter = d3.format('.3~s')

                    const colorFunction = d3
                        .scaleThreshold()
                        .domain(airMapConfigs[year].passengers.breaks) // ascending thresholds
                        .range(airMapConfigs[year].passengers.colors) // length = breaks.length + 1

                    function parseChangeToPct(v) {
                        if (v == null) return NaN
                        const s = String(v).trim()
                        const hasPct = s.includes('%')
                        let n = parseFloat(s.replace('%', ''))
                        if (!hasPct && Math.abs(n) <= 1) n *= 100 // interpret small decimals as fractions
                        return n
                    }

                    const spaceAsThousandSeparator = function (number) {
                        return number.toLocaleString('en').replace(/,/gi, ' ')
                    }
                    const tooltipFunction = function (link, map) {
                        const buf = []
                        const statData = map.statData()
                        const unit = statData.unitText() || ''

                        // Header with region name and ID
                        const title = `${link.source.name || link.source.id} and ${link.target.name || link.target.id}`
                        buf.push(`
                        <div class="em-tooltip-bar">
                            <b>${title}</b>
                        </div>
                    `)

                        // Value
                        buf.push(`<div class='em-tooltip-text'>
                        <table class="em-tooltip-table">
                            <tbody>
                                <tr><td>Passengers: ${spaceAsThousandSeparator(link.value)}</td></tr>
                                <tr>
                            <td>
                                Change since ${year - 1}:
                                <span
                                style="
                                    background:${colorFunction(parseChangeToPct(link.target.change))};
                                    color:${getContrastTextColor(colorFunction(parseChangeToPct(link.target.change)))};
                                    padding:2px 4px;
                                    border-radius:3px;
                                "
                                >
                                ${link.target.change}
                                </span>
                            </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>`)

                        return buf.join('')
                    }

                    const map = eurostatmap
                        .map('flow')

                        //static settings
                        .header(true)
                        .footer(true)
                        .zoomButtons(false)
                        .showEstatLogo(true)
                        .showEstatRibbon(true)
                        .logoPosition([2, height + 42])
                        .ribbonPosition([width - 180, height + 20])
                        .ribbonWidth(300)
                        .ribbonHeight(50)
                        //end static settings

                        .svgId('air-passengers-map')
                        .hoverColor('#ffc700')
                        .width(width)
                        .height(height)
                        .title('Extra-EU air passenger transport, 2025')
                        .subtitle(`Transport of passengers between the EU and the rest of the world`)

                        //projection
                        .projectionFunction(worldProjection)

                        //geometries
                        .geo('WORLD')
                        .proj('4326')
                        .scale('60M')

                        // flow settings
                        .flowGraph(graphData)
                        .flowSettings({ minWidth: 4, maxWidth: 70, lineType: 'curved', nodeType: false ? 'donut' : 'circle' })
                        // .flowColor("#72bb6f")
                        .flowSettings({
                            color: (d) => {
                                if (!d.target || !d.target.change) {
                                    console.log(d)
                                    return '#999999'
                                }
                                return colorFunction(parseChangeToPct(d.target.change))
                            },
                        })
                        .flowSettings({ opacity: 0.9, arrows: false, outlines: true, outlineWidth: 2, outlineColor: 'white', colorGradient: false, widthGradient: false, topLocations: 0, stack: false, nodes: false })

                        // legend
                        .legend({
                            x: width - 205,
                            y: 60,
                            boxPadding: 10,
                            boxOpacity: 1,
                            title: 'Passengers carried',
                            flowWidthLegend: {
                                marginTop: -10,
                                //orientation:'vertical',
                                values: airMapConfigs[year].passengers.legend.sizeLegend.values,
                                labels: airMapConfigs[year].passengers.legend.sizeLegend.labels,
                            },
                            flowColorLegend: {
                                marginTop: 60,
                                title: airMapConfigs[year].passengers.legend.title,
                                items: makeLegendItems(year),
                            },
                        })

                        //labels
                        .labels({
                            labels: regionLabels,
                            shadows: true,
                            values: true,
                            valuesFormatter: valuesLabelFormatter,
                        })

                        .tooltip({
                            textFunction: tooltipFunction,
                        })

                        .footnote(
                            "Note: Passengers carried includes both arrivals and departures. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <tspan style='font-style: italic;'>Source</tspan>: Eurostat (avia_paexcc)"
                        )
                        .footnoteWrap(150)

                        // zoom min/max
                        .zoomExtent([0.6, 10])

                        .callback(() => {
                            // set fill of regions
                            const countries = d3.selectAll('#air-passengers-map .em-worldrg path')
                            countries.style('fill', (d) => regionalColors[regionByCountry.get(d.properties.id)] ?? '#efefef')
                            // raise labels (fixed in next version of estatmap)
                            const labels = d3.selectAll('#em-labels')
                            labels.raise()

                            //add cartography text
                            // --- REMOVE if it already exists ---
                            d3.select('#air-passengers-map #em-footnote-2').remove()

                            d3.selectAll('#air-passengers-map')
                                .append('text')
                                .attr('x', width - 315)
                                .attr('y', height + 100)
                                .attr('class', 'em-footnote')
                                .attr('id', 'em-footnote-2')
                                .append('tspan')
                                .html('Cartography: GISCO, Boundaries: ©EuroGeographics ©OSM')
                        })
                        .build()

                    const exportBtnPNG = document.getElementById('export-png-btn')
                    exportBtnPNG.addEventListener('click', function () {
                        map.exportMapToPNG(1080, Number(map.svg().attr('height')), 'air-passengers-2025')
                    })

                    const exportBtnSVG = document.getElementById('export-svg-btn')
                    exportBtnSVG.addEventListener('click', function () {
                        map.exportMapToSVG()
                    })
                })
                .catch((err) => console.error(err))

            function getContrastTextColor(hex) {
                hex = hex.replace('#', '')
                if (hex.length === 3) {
                    hex = hex
                        .split('')
                        .map((c) => c + c)
                        .join('')
                }

                const r = parseInt(hex.substr(0, 2), 16)
                const g = parseInt(hex.substr(2, 2), 16)
                const b = parseInt(hex.substr(4, 2), 16)

                // Perceived luminance
                const luminance = 0.299 * r + 0.587 * g + 0.114 * b

                return luminance > 140 ? 'black' : 'white'
            }
        </script>
    </body>
</html>
