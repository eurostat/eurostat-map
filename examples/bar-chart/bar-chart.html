<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bar Chart Map</title>
        <style>
            body {
                margin: 0;
                padding: 8px;
            }

            /* a phone: the map fills the screen */
            @media (max-width: 900px) {
                body {
                    padding: 0;
                }
            }

            .em-grid-rect,
            .em-grid-hexagon {
                fill: white;
                stroke: #dfdfdf !important;
            }
        </style>
    </head>
    <body>
        <svg id="map"></svg>

        <script src="../../build/eurostatmap.js"></script>
        <script type="module">
            // the reusable settings panel (Eurostat UI components), shared by the examples
            import { createPanel } from '../vendor/example-panel.js'

            const state = { barType: 'grouped', nutsLevel: 0, gridCartogram: false }
            let map

            const panel = createPanel({ map: '#map', title: 'Map settings' })
            panel.select({
                id: 'barType',
                label: 'Bar type',
                value: state.barType,
                options: [
                    { value: 'grouped', label: 'Grouped (vertical)' },
                    { value: 'stacked', label: 'Stacked (horizontal)' },
                ],
                onChange: (v) => {
                    state.barType = v
                    buildMap()
                },
            })
            panel.radio({
                id: 'nutsLevel',
                label: 'NUTS level',
                value: state.nutsLevel,
                options: [0, 1, 2, 3].map((n) => ({ value: n, label: String(n) })),
                onChange: (v) => {
                    state.nutsLevel = +v
                    buildMap()
                },
            })
            panel.checkbox({
                id: 'gridCartogram',
                label: 'Grid cartogram',
                checked: state.gridCartogram,
                onChange: (v) => {
                    state.gridCartogram = v
                    buildMap()
                },
            })

            function buildMap() {
                // the grid cartogram only exists for countries
                panel.show('gridCartogram', state.nutsLevel === 0)
                if (map) map.svg().selectAll('*').remove()

                const useGridCartogram = state.gridCartogram && state.nutsLevel === 0

                map = eurostatmap
                    .map('bar')
                    .svgId('map')
                    .title('Tourism nights spent by residence of guest')
                    .subtitle(`NUTS ${state.nutsLevel}, 2022`)
                    .nutsLevel(state.nutsLevel)
                    .scale('20M')
                    .barSettings({ type: state.barType })
                    // Stacked sizing
                    // .barMinWidth(6)
                    // .barMaxWidth(70)
                    .barSettings({ height: 10 })
                    // Grouped sizing
                    .barSettings({ groupWidth: 8, groupGap: 0, groupMaxHeight: 40 })
                    .stat('composition', {
                        eurostatDatasetCode: 'tour_occ_nin2',
                        filters: { unit: 'NR', time: '2022', nace_r2: 'I551-I553' },
                        unitText: 'Nights',
                        categoryParameter: 'c_resid',
                        categoryCodes: ['FOR', 'DOM'],
                        categoryLabels: ['Foreign', 'Domestic'],
                        categoryColors: ['#7fc97f', '#beaed4'],
                    })
                    .encoding('composition', { stat: 'composition' })
                    .legend({
                        x: 570,
                        y: 0,
                        sizeLegend: {
                            title: 'Total nights spent',
                            titlePadding: 15,
                            offsetX: 14,
                            cells: 2,
                        },
                        colorLegend: {
                            title: 'Residence of guest',
                            marginTop: 30,
                            noData: false,
                        },
                    })

                // the offset moves the bars down (room for the country labels in the wide cells); in the small cells of a
                // phone it would push them out of the cell
                if (useGridCartogram) {
                    const narrow = window.matchMedia('(max-width: 900px)').matches
                    map.gridCartogram(true).gridCartogramSettings({ chartOffset: { x: 0, y: narrow ? 0 : 20 } })
                }

                map.build()
            }

            buildMap()
        </script>
    </body>
</html>
