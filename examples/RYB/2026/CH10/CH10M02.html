<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tourism Coxcomb Map - CH10M02</title>
        <link rel="stylesheet" href="../common/insets/insets.css" />
        <link rel="stylesheet" href="../common/styles.css" />
        <style>
            button {
                margin: 10px;
                padding: 10px 20px;
                cursor: pointer;
                font-size: 16px;
            }
            #log {
                height: 100%;
                font-family: monospace;
                background: #f0f0f0;
                padding: 10px;
                max-height: 600px;
                overflow-y: auto;
                font-size: 12px;
            }
            .em-inset .em-zoom-buttons {
                display: none;
            }
            .em-legend-wedge {
                stroke: black !important;
            }
            .em-legend {
                filter: drop-shadow(0px 1px 1px rgba(0, 0, 0, 0.3));
            }
            #newInsets {
                display: none;
            }
        </style>
    </head>
    <body>
        <div style="display: none">
            <button id="export-png-btn" type="button">Download map as PNG</button>
            <button id="export-svg-btn" type="button">Download map as SVG</button>
        </div>
        <svg id="container">
            <svg id="map"></svg>
            <g id="newInsets"></g>
        </svg>

        <script src="../../../../build/eurostatmap.js"></script>
        <script src="https://unpkg.com/d3@7"></script>
        <script src="../common/insets/overseas.js"></script>
        <script src="../common/responsive-map.js"></script>
        <script>
            const MAPWIDTH = 700
            const MAPHEIGHT = 600
            const LEGENDX = 530
            const LEGENDY = 327
            const INSETBOXPOSITION = [405, 70]
            // Generate fresh inset config with new svgIds (from overseas.js)
            const insetsCfg = createOutermostInsetsConfig()
            createInsetDOMElements(document.getElementById('newInsets'), insetsCfg, INSETBOXPOSITION)

            // data
            const MONTH_KEYS = ['M01', 'M02', 'M03', 'M04', 'M05', 'M06', 'M07', 'M08', 'M09', 'M10', 'M11', 'M12']
            const CSV_MONTH_COLS = [
                'January',
                'February',
                'March',
                'April',
                'May',
                'June',
                'July',
                'August',
                'September',
                'October',
                'November',
                'December',
            ]

            async function loadData() {
                const [domRes, forRes] = await Promise.all([fetch('data/M02/DOMESTIC.csv'), fetch('data/M02/INTERNATIONAL.csv')])
                const [domText, forText] = await Promise.all([domRes.text(), forRes.text()])

                const domData = parseCSV(domText)
                const forData = parseCSV(forText)

                const customData = {}
                const allNuts = new Set([...Object.keys(domData), ...Object.keys(forData)])

                allNuts.forEach((nuts) => {
                    customData[nuts] = {}
                    MONTH_KEYS.forEach((month) => {
                        const dom = domData[nuts]?.[month] ?? ':'
                        const forVal = forData[nuts]?.[month] ?? ':'

                        const domIsND = dom === ':'
                        const forIsND = forVal === ':'

                        // If both categories are no-data, mark the whole month as no-data
                        if (domIsND && forIsND) {
                            customData[nuts][month] = {
                                DOM: ':',
                                FOR: ':',
                                TOTAL: ':',
                            }
                        } else {
                            const domVal = domIsND ? 0 : dom
                            const forVal2 = forIsND ? 0 : forVal
                            customData[nuts][month] = {
                                DOM: domIsND ? ':' : domVal,
                                FOR: forIsND ? ':' : forVal2,
                                TOTAL: domVal + forVal2,
                            }
                        }
                    })
                })

                return customData
            }

            loadData().then((customData) => {
                const map = eurostatmap
                    .map('coxcomb')
                    .containerId('container')
                    .width(MAPWIDTH)
                    .height(MAPHEIGHT)
                    .header(true)
                    .title('Nights spent in tourist accommodation')
                    .subtitle('(by NUTS 2 regions, 2024)')
                    .position({ x: 4800000, y: 3400000, z: 7000 })
                    .dorling(true)
                    .dorlingStrength({ x: 10, y: 10 }) // Gravity toward original position
                    .dorlingIterations(1) // Collision detection iterations
                    .dorlingPadding(-1) // Minimum distance between circles
                    .animateDorling(false) // Skip animation for immediate result
                    .nutsLevel('mixed')
                    .statCoxcomb({
                        customData: customData,
                        times: MONTH_KEYS,
                        timeLabels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                        categoryCodes: ['DOM', 'FOR'],
                        categoryLabels: ['Domestic', 'International'],
                        categoryColors: ['#B09120', '#104F99'], //  '#705B13' Sienna dark & Forest dark //['#AF155C', '#2644A7'], //R239/G209/B140
                        totalCode: 'TOTAL',
                        unitText: 'Nights',
                    })
                    .coxcombSettings({ maxRadius: 34, minRadius: 5, strokeWidth: 0.1, strokeFill: 'none', rings: false })
                    .zoomButtons(false)
                    .insets(insetsCfg)
                    .insetBoxPosition(INSETBOXPOSITION)
                    .insetsButton(true)
                    .legend({
                        boxOpacity: 1,
                        x: LEGENDX,
                        y: LEGENDY,
                        sizeLegend: {
                            title: 'Nights spent',
                            marginTop: 45,
                            titlePadding: 10,
                            noData: false,
                            values: [25000000, 10000000, 1000000],
                            labels: ['25 million', '10 million', '1 million'],
                        },
                        colorLegend: { title: 'Residence of tourist', marginTop: 35, titlePadding: 10, noData: false },
                        timeLegend: { title: 'Month', titlePadding: 33, marginTop: -33 },
                    })
                    .bottomText(false)
                    .header(true)
                    .footer(true)
                    .showEstatLogo(true)
                    //.showEstatRibbon(true)
                    .ribbonPosition([MAPWIDTH - 180, MAPHEIGHT - 17])
                    .ribbonWidth(300)
                    .ribbonHeight(50)
                    .footnoteWrap(90)
                    .footnote(
                        "Note: the individual symbols for each region should be read like a clock, with 12 o'clock being the start and end of the year. <br>Source: Eurostat (online data codes: tour_occ_nin2m and tour_occ_nim)"
                    )
                    .onBuild(() => {
                        // move newInsets inside #map
                        const newInsets = d3.select('#newInsets')
                        if (!newInsets.empty()) {
                            d3.select('#map').node().appendChild(newInsets.node())
                        }

                        // #newInsets holds the actual visible overseas insets (Canarias, Malta,
                        // etc. - built by overseas.js/createInsetDOMElements, NOT the library's own
                        // .insets() rendering target, #em-insets-group, which stays empty on this
                        // page). insetsButton(true)'s own click handler only toggles #em-insets-group
                        // (see appendInsetsButton in src/core/buttons/insets-button.js), so it has no
                        // visible effect here - wire it to #newInsets directly instead.
                        d3.select('#em-insets-button').on('click', (event) => {
                            event.preventDefault()
                            event.stopPropagation()
                            const el = document.getElementById('newInsets')
                            const hidden = getComputedStyle(el).display === 'none'
                            // 'block' (not '') - #newInsets's display:none comes from the stylesheet
                            // rule above, and an empty inline value wouldn't override it since it's
                            // the SAME element the stylesheet rule already targets.
                            el.style.display = hidden ? 'block' : 'none'
                        })

                        //add cartography footnote
                        d3.select('#map #em-footnote-2').remove()
                        d3.select('#map')
                            .append('text')
                            .attr('x', MAPWIDTH - 272)
                            .attr('y', MAPHEIGHT + 83)
                            .attr('class', 'em-footnote')
                            .attr('id', 'em-footnote-2')
                            .html('Administrative Boundaries: ©EuroGeographics ©OSM')

                        d3.select('#map')
                            .append('text')
                            .attr('x', MAPWIDTH - 209)
                            .attr('y', MAPHEIGHT + 96)
                            .attr('class', 'em-footnote')
                            .attr('id', 'em-footnote-2')
                            .html('Cartography: Eurostat – GISCO, 06/2026')

                        // Make the whole map responsive: scale #container fluidly up to 700px wide
                        // instead of rendering at its fixed native size (see responsive-map.js).
                        // #map itself keeps its native MAPWIDTH/MAPHEIGHT pixel attributes - only
                        // the OUTER #container gets a viewBox (matching #map's real height
                        // attribute) and is scaled down/up via CSS.
                        //
                        // Deferred: the library grows #map's height attribute to fit a wrapped
                        // footnote in its own setTimeout(..., 20) inside recalculateLayout() (see
                        // src/core/map-instance.js), which runs AFTER onBuild fires. Reading #map's
                        // height synchronously here would catch it still at its pre-growth value,
                        // clipping the footnote/credits whenever the footnote wraps to more lines
                        // than the original MAPHEIGHT budget assumed.
                        setTimeout(() => RYBResponsiveMap.makeResponsive('container', 'map'), 30)
                    })
                    .zoomExtent([0.9, 100])
                    .build()

                const exportBtnPNG = document.getElementById('export-png-btn')
                exportBtnPNG.addEventListener('click', function () {
                    const factor = 1
                    map.exportMapToPNG(MAPWIDTH * factor, MAPHEIGHT + 120 * factor) // width, height, scale (for better quality)
                })

                const exportBtnSVG = document.getElementById('export-svg-btn')
                exportBtnSVG.addEventListener('click', function () {
                    map.exportMapToSVG('CH10M02-coxcomb') // filename without extension
                })
            })

            // Properly splits a CSV line respecting quoted fields
            function splitCSVLine(line) {
                const result = []
                let current = ''
                let inQuotes = false
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i]
                    if (ch === '\r') continue // ← skip carriage returns anywhere in line
                    if (ch === '"') {
                        inQuotes = !inQuotes
                    } else if (ch === ',' && !inQuotes) {
                        result.push(current)
                        current = ''
                    } else {
                        current += ch
                    }
                }
                result.push(current)
                return result
            }

            function parseCSV(text) {
                const lines = text.trim().split('\n')
                const headers = splitCSVLine(lines[0])
                const data = {}
                for (let i = 1; i < lines.length; i++) {
                    const cols = splitCSVLine(lines[i])
                    const nuts = cols[0].trim()
                    if (!nuts) continue
                    data[nuts] = {}
                    CSV_MONTH_COLS.forEach((month, idx) => {
                        const colIdx = headers.indexOf(month)
                        const raw = colIdx !== -1 ? cols[colIdx] : ''
                        const parsed = raw === ':' ? ':' : raw ? parseFloat(raw) * 1_000_000 || 0 : 0
                        data[nuts][MONTH_KEYS[idx]] = parsed
                    })
                }
                return data
            }
        </script>
    </body>
</html>
