<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Maritime passengers mushroom map</title>
        <link rel="stylesheet" href="../common/styles.css" />
        <style>
            body {
                margin: 0;
            }
            .em-legend-background {
                filter: none;
            }
            .em-mushroom-segment {
                stroke: white;
                stroke-width: 0.5;
            }
            .em-zoom-buttons {
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
                transform: translate(95%, 89%);
                display: none;
            }
            .em-inset {
                filter: drop-shadow(0.7px 0.7px 0.7px rgba(0, 0, 0, 0.5));
            }
            .em-insets .em-frame {
                stroke: grey;
                stroke-width: 1px !important;
            }
            .em-cntbn,
            .em-kosovo-bn {
                opacity: 0.4;
            }
            g.em-annotation-be-nl .connector {
                transform: translate(-20px, -13px);
            }
            .em-cntrg {
                fill: #f2f2f2 !important;
            }
            .em-cntbn {
                opacity: 0.4 !important;
            }
            .a-napoli .annotation-note-title {
                transform: translate(0px, 10px);
            }
            .paloukia .annotation-note-title {
                transform: translate(14px, -3px);
            }
            .calabria .annotation-note-title {
                transform: translate(-3px, -1px);
            }
        </style>
    </head>

    <body>
        <div style="display: none">
            <button id="toggle-edit-mode-btn" type="button">Toggle annotation edit mode</button>
            <button id="export-annotations-btn" type="button">Export annotations JSON</button>
            |
            <button id="export-png-btn" type="button">Download map as PNG</button>
            <button id="export-svg-btn" type="button">Download map as SVG</button>
        </div>
        <svg id="map"></svg>
        <script src="../../../../build/eurostatmap.js"></script>
        <script src="https://unpkg.com/d3@7"></script>
        <script src="https://unpkg.com/proj4"></script>
        <script src="./exportAnnotations.js"></script>
        <script src="../common/responsive-map.js"></script>

        <script type="module">
            // Resized from the original print layout (1080x900) to a 700px-wide web embed - see
            // the matching comment in CH11M04.html and comments.md's "700px wide for online
            // websites" item for the full rationale.
            const RESIZE_SCALE = 700 / 1080
            const MAPWIDTH = 700
            const MAPHEIGHT = Math.round(900 * RESIZE_SCALE)
            const annotationsFileName = 'maritime-passengers-annotations.json'
            const annotationsFilePath = `./data/M05/${annotationsFileName}`
            const loadedAnnotations = await (await fetch(annotationsFilePath)).json()
            window.ch11M05Annotations = loadedAnnotations
            let annotationsEditMode = false

            //data load
            const [stats] = await Promise.all([d3.json('./data/M05/maritime-passengers.json')])
            const inwardData = indexByCode([...stats], 'disembarked')
            const outwardData = indexByCode([...stats], 'embarked')

            //projection
            // european projection
            proj4.defs('EPSG:3035', '+proj=laea +lat_0=52 +lon_0=10 +x_0=4321000 +y_0=3210000 ' + '+ellps=GRS80 +units=m +no_defs +type=crs')
            const to3035 = ([lon, lat]) => proj4('EPSG:4326', 'EPSG:3035', [lon, lat])
            //canarias
            proj4.defs('EPSG:32628', '+proj=utm +zone=28 +datum=WGS84 +units=m +no_defs +type=crs')
            const to32628 = ([lon, lat]) => proj4('EPSG:4326', 'EPSG:32628', [lon, lat])
            //guadeloupe, martinique
            proj4.defs('EPSG:32620', '+proj=utm +zone=20 +datum=WGS84 +units=m +no_defs +type=crs')
            const to32620 = ([lon, lat]) => proj4('EPSG:4326', 'EPSG:32620', [lon, lat])
            //reunion
            proj4.defs('EPSG:32740', '+proj=utm +zone=40 +south +datum=WGS84 +units=m +no_defs +type=crs')
            const to32740 = ([lon, lat]) => proj4('EPSG:4326', 'EPSG:32740', [lon, lat])

            const getBBOXAsGeoJSON = function (bb) {
                return {
                    type: 'Feature',
                    geometry: {
                        type: 'MultiPoint',
                        coordinates: [
                            [bb[0], bb[1]],
                            [bb[2], bb[3]],
                        ],
                    },
                }
            }
            const getApproxCurrentGeoBbox = function () {
                const defaultPosition = { x: 4790000, y: 3420000, z: 1000 }
                const halfWidth = 0.6 * defaultPosition.z * MAPWIDTH
                const halfHeight = 0.6 * defaultPosition.z * MAPHEIGHT
                return [defaultPosition.x - halfWidth, defaultPosition.y - halfHeight, defaultPosition.x + halfWidth, defaultPosition.y + halfHeight]
            }
            const portsProjection = d3.geoIdentity().reflectY(true).fitSize([MAPWIDTH, MAPHEIGHT], getBBOXAsGeoJSON(getApproxCurrentGeoBbox()))

            // build map
            // insetWidth nudged up from the strict 94*scale (61px) to 76px - see the matching
            // comment in CH11M04.html (the longest inset title, "Guadeloupe (FR)", otherwise gets
            // clipped by its own box since inset title font-size doesn't shrink with it).
            const insetHeight = Math.round(90 * RESIZE_SCALE),
                insetWidth = 76,
                padding = Math.round(10 * RESIZE_SCALE)
            const map = eurostatmap
                .map('mushroom')
                .svgId('map')
                .title('Maritime passengers embarked and disembarked')
                .subtitle('(by main ports, 2024)')
                .footer(true)
                .footnoteWrap(78)
                .header(true)
                .footnote(
                    'Note: the map shows data for ports with at least 100 000 passengers embarked and disembarked. Estonian ports excluded. Top 10 EU ports labelled. <br> Source: Eurostat (online data code: mar_pa_aa)'
                )
                .width(MAPWIDTH)
                .height(MAPHEIGHT)
                // z scaled up (smaller canvas needs a higher z to show the same geographic extent
                // at the same on-screen position/size relative to the frame)
                .position({ x: 4500000, y: 3300000, z: 7000 })
                .nutsLevel(0)
                .dorling(true)
                .zoomButtons(true)
                .zoomExtent([0.9, 100])
                .showEstatLogo(true)
                .logoPosition([3, 624])
                .hoverColor('#ffa500')
                .mushroomSettings({
                    minSize: 0.1,
                    maxSize: 14,
                    colors: ['#33A033', '#B09120'],
                    orientation: 'horizontal',
                })
                .legend({
                    //title: 'Passengers',
                    onlyApplyOpacityWhileZoomed: true,
                    x: Math.round(10 * RESIZE_SCALE),
                    y: Math.round(220 * RESIZE_SCALE),
                    sizeLegend: {
                        title: 'Number of passengers',
                        values: [6000000, 100000],
                        labels: ['6 million', '100 thousand'],
                    },
                    colorLegend: { title: 'Passenger movements', marginTop: 20, titlePadding: -5 },
                })
                .tooltip({
                    textFunction: tooltipTextFunction,
                })
                .insetBoxPosition([MAPWIDTH - insetWidth - 20, 10])
                .insets([
                    {
                        title: 'Canarias',
                        geo: 'IC',
                        x: 0,
                        y: 0,
                        position: { z: 7000 },
                        width: insetWidth,
                        height: insetHeight,
                        titlePosition: [4, 14],
                    },
                    {
                        title: 'Guadeloupe',
                        geo: 'GP',
                        x: 0,
                        y: insetHeight + padding,
                        width: insetWidth,
                        height: insetHeight,
                        position: { x: 680000, y: 1810000, z: 2300 },
                        titlePosition: [4, 14],
                        // showScalebar: true,
                        // scalebarPosition: [48, 55],
                    },
                    {
                        title: 'Martinique',
                        geo: 'MQ',
                        x: 0,
                        y: insetHeight * 2 + padding * 2,
                        position: { z: 1700 },
                        width: insetWidth,
                        height: insetHeight,
                        titlePosition: [4, 14],
                    },
                    {
                        title: 'Réunion',
                        geo: 'RE',
                        x: 0,
                        y: insetHeight * 3 + padding * 3,
                        position: { x: 348011, y: 7671627, z: 2000 },
                        width: insetWidth,
                        height: insetHeight,
                        titlePosition: [4, 14],
                    },
                ])
                .onBuild(() => {
                    const portKeys = stats.map((d) => d.code)
                    //color regions
                    d3.selectAll('#map .em-nutsrg path').attr('fill', (d) => {
                        const iso = d.properties.id // e.g. "NL"
                        const hasPort = portKeys.some((k) => k.startsWith(iso)) || iso == 'EL'
                        return hasPort ? '#fff4cc' : '#F2F2F2'
                    })

                    // --- REMOVE if it already exists ---
                    // Right-aligned at a fixed right margin and stacked as two lines (rather than
                    // the original print layout's side-by-side placement, which only fit at the
                    // wider 1080px canvas) so both lines fit within the narrower 700px web width.
                    d3.select('#map #em-footnote-2').remove()
                    d3.select('#map')
                        .append('text')
                        .attr('x', MAPWIDTH - 10)
                        .attr('y', MAPHEIGHT + 88)
                        .attr('text-anchor', 'end')
                        .attr('class', 'em-footnote')
                        .attr('id', 'em-footnote-2')
                        .html('Administrative Boundaries: ©EuroGeographics ©OSM')

                    d3.select('#map')
                        .append('text')
                        .attr('x', MAPWIDTH - 10)
                        .attr('y', MAPHEIGHT + 102)
                        .attr('text-anchor', 'end')
                        .attr('class', 'em-footnote')
                        .attr('id', 'em-footnote-2')
                        .html('Cartography: Eurostat – GISCO, 06/2026')

                    // Make the map responsive: scale #map fluidly up to 700px wide instead of
                    // rendering at its fixed native size (see responsive-map.js). Internal layout
                    // (annotations, symbol sizes, insets) keeps its native MAPWIDTH/MAPHEIGHT pixel
                    // values - only the rendered box is scaled via a viewBox + CSS.
                    RYBResponsiveMap.makeResponsive('map', MAPWIDTH, MAPHEIGHT + 140)
                })
                .filterGeometriesFunction((geometries, map) => {
                    //remove greenland to stop title overlap
                    let nuts2json = geometries[0]
                    let countries = nuts2json.objects.cntrg.geometries
                    countries = countries.filter((f) => {
                        if (f.properties.id !== 'GL' && f.properties.na !== 'Greenland') {
                            return f
                        } else {
                            return false
                        }
                    })
                    nuts2json.objects.cntrg.geometries = countries

                    // add ports to centroids array
                    // each port location must be reprojected to the map projection
                    //
                    // This same filter function runs once for the main map AND once per inset
                    // (see AGENTS.md/comments.md - filterGeometriesFunction is forwarded to
                    // insets as-is). The overseas insets (Canarias/Guadeloupe/Martinique) only
                    // ever want their own single designated port (matched below by code),
                    // reprojected into that inset's own local space - not every port on the
                    // mainland map reprojected (usually nonsensically) into their tiny viewport.
                    // Malta has no dedicated port/reprojection case below, so it gets none rather
                    // than every port smeared into it.
                    const overseasInsetPortCodes = {
                        IC: ['ES02ESLPA', 'ES0ESLPA'],
                        GP: ['FR04GPPTP', 'FR0GPPTP'],
                        MQ: ['FR04MQFDF', 'FR0MQFDF'],
                    }
                    const isOverseasInset = map?.isInset && Object.prototype.hasOwnProperty.call(overseasInsetPortCodes, map.geo_)
                    const isUnmappedInset = map?.isInset && !isOverseasInset && map.geo_ !== 'EUR'
                    const portsForThisMap = isUnmappedInset
                        ? []
                        : isOverseasInset
                          ? stats.filter((d) => overseasInsetPortCodes[map.geo_].includes(d.code))
                          : stats

                    let centroids = geometries[1]
                    ;[...portsForThisMap].forEach((d) => {
                        let newCentroid
                        if (d.code == 'ES02ESLPA' || d.code == 'ES0ESLPA') {
                            // handle canarias (inset map)
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32628([d.lon, d.lat]), // IC_32628 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else if (d.code == 'FR04GPPTP' || d.code == 'FR0GPPTP') {
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32620([d.lon, d.lat]), // GP_32620 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else if (d.code == 'FR04MQFDF' || d.code == 'FR0MQFDF') {
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32620([d.lon, d.lat]), // MQ_32620 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else if (d.code == 'FR05RELPT' || d.code == 'FR0RELPT') {
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: to32740([d.lon, d.lat]), // RE_32740 fixed position in inset
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: undefined,
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        } else {
                            let coords = to3035([d.lon, d.lat])
                            newCentroid = {
                                type: 'Feature',
                                geometry: {
                                    coordinates: coords,
                                    type: 'Point',
                                },
                                properties: {
                                    centroid: portsProjection(coords),
                                    id: d.code,
                                    na: d.name,
                                },
                            }
                        }

                        centroids.features.push(newCentroid)
                    })
                    return geometries
                })
            // .annotations({
            //     editMode: annotationsEditMode,
            //     annotations: window.ch11M05Annotations,
            // })

            map.stat('v1', { label: 'Disembarked' }).stat('v2', { label: 'Embarked' })
            map.build()
            map.statData('v1').setData(filterNulls(inwardData))
            map.statData('v2').setData(filterNulls(outwardData))

            const editModeBtn = document.getElementById('toggle-edit-mode-btn')
            editModeBtn.addEventListener('click', function () {
                annotationsEditMode = !annotationsEditMode
                map.annotations({
                    editMode: annotationsEditMode,
                    annotations: window.ch11M05Annotations,
                })
            })

            const exportAnnotationsBtn = document.getElementById('export-annotations-btn')
            exportAnnotationsBtn.addEventListener('click', function () {
                const result = generateMapAnnotations(window.ch11M05Annotations)
                downloadAnnotationsJSON(result, annotationsFileName)
                console.log('Exported annotations:', result)
            })

            function filterNulls(obj) {
                return Object.fromEntries(Object.entries(obj).filter(([_, v]) => v !== null))
            }

            function indexByCode(portsData, valueKey) {
                return Object.fromEntries(portsData.map((p) => [p.code, p[valueKey]]))
            }

            function tooltipTextFunction(region, map) {
                const regionName = region.properties.na
                const regionId = region.properties.id

                const isCountry = regionId.length === 2

                let inward = 0
                let outward = 0

                if (isCountry) {
                    // 🇪🇺 Country hover → sum all ports in that country
                    stats.forEach((d) => {
                        if (d.country === regionId) {
                            inward += +d.disembarked || 0
                            outward += +d.embarked || 0
                        }
                    })
                } else {
                    // ⚓ Port hover → direct lookup
                    const port = stats.find((d) => d.code === regionId)
                    if (port) {
                        inward = +port.disembarked || 0
                        outward = +port.embarked || 0
                    }
                }

                const row1 = `<tr><td>Disembarked: ${(inward / 1e6).toFixed(1)} million passengers</td></tr>`
                const row2 = `<tr><td>Embarked: ${(outward / 1e6).toFixed(1)} million passengers</td></tr>`

                return `
                <div class="em-tooltip-bar">
                    <b>${regionName}</b>
                </div>
                <div class="em-tooltip-text">
                    <table class="em-tooltip-table">
                        <tbody>
                            ${row1}
                            ${row2}
                        </tbody>
                    </table>
                </div>
            `.trim()
            }

            const exportBtnPNG = document.getElementById('export-png-btn')
            exportBtnPNG.addEventListener('click', function () {
                const factor = 1
                // +140 (was +120): the footnote now wraps to more lines at this width
                // (footnoteWrap(90)), so the footer band is slightly taller than before.
                map.exportMapToPNG(MAPWIDTH * factor, MAPHEIGHT + 140 * factor) // width, height, scale (for better quality)
            })

            const exportBtnSVG = document.getElementById('export-svg-btn')
            exportBtnSVG.addEventListener('click', function () {
                map.exportMapToSVG('CH11M05-maritime-passengers') // filename without extension
            })
        </script>
    </body>
</html>
