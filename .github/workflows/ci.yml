name: CI

on:
    push:
        branches:
            - master
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            # the lockfile is the build toolchain: never `npm install` here (docs/release-flow.md)
            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run type-check

            - name: Build the bundles
              run: npm run build

            - name: Install the test browser
              run: npx playwright install --with-deps chromium

            - name: Tests
              run: npm test
