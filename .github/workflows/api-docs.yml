name: Regenerate API docs

# docs/api is generated by typedoc from src/types. Keep it in sync automatically so it can't go stale.
on:
    push:
        branches:
            - master
        paths:
            - 'src/types/**'
            - 'typedoc.json'
            - 'package.json'

permissions:
    contents: write

jobs:
    api-docs:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Regenerate docs/api
              run: npm run update-docs

            - name: Commit changes
              run: |
                  if [ -n "$(git status --porcelain docs/api)" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add docs/api
                    git commit -m "Regenerate API docs"
                    git pull --rebase origin master
                    git push origin master
                  else
                    echo "docs/api is up to date"
                  fi
